<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로젝트 보드 · KJC Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Roboto:ital,wght@0,400;0,700;1,900&display=swap" rel="stylesheet">

<!-- 색상은 theme.css 한 곳에서만 정합니다 -->
<link rel="stylesheet" href="theme.css">

<style>
/* ==========================================================================
   KJC Studio · 프로젝트 보드 — 레이아웃
   색상 값은 이 파일에 직접 쓰지 않습니다. 전부 theme.css 의 변수를 씁니다.
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--pj-bg);
  color: var(--pj-text-primary);
  font-family: var(--pj-font-body);
  font-weight: 400;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 1400px; margin: 0 auto; padding: 54px 28px 90px; }

/* ── 헤더 ─────────────────────────────── */
.eyebrow {
  font-family: var(--pj-font-display);
  font-size: 12px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--pj-text-muted);
  margin-bottom: 14px;
}
.eyebrow a { color: inherit; text-decoration: none; }
.eyebrow a:hover { color: var(--pj-accent); }

h1 {
  font-family: var(--pj-font-display);
  font-style: italic;
  font-weight: 900;
  font-size: clamp(34px, 6vw, 58px);
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin-bottom: 10px;
}
.subtitle { color: var(--pj-text-secondary); font-size: 15px; }

/* ── 요약 ─────────────────────────────── */
.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 32px 0 22px; }
.sum-card {
  background: var(--pj-bg-card);
  border: 1px solid var(--pj-border);
  border-radius: 12px;
  padding: 16px 18px;
  box-shadow: var(--pj-shadow-sm);
}
.sum-label { font-size: 12px; color: var(--pj-text-muted); margin-bottom: 4px; }
.sum-value { font-family: var(--pj-font-display); font-weight: 700; font-size: 24px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.sum-value.accent { color: var(--pj-accent); }
.sum-value.warn { color: var(--pj-warn); }
.sum-value.done { color: var(--pj-done); }
.sum-unit { font-size: 13px; font-weight: 400; color: var(--pj-text-secondary); margin-left: 2px; }

/* ── 도구 ─────────────────────────────── */
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
.btn {
  font-family: inherit; font-size: 13px; font-weight: 400;
  color: var(--pj-text-secondary); background: var(--pj-bg-card);
  border: 1px solid var(--pj-border); border-radius: 99px;
  padding: 8px 17px; cursor: pointer; transition: all 0.18s ease; white-space: nowrap;
}
.btn:hover { color: var(--pj-text-primary); border-color: var(--pj-border-strong); }
.btn.primary { color: var(--pj-text-on-fill); background: var(--pj-accent); border-color: var(--pj-accent); font-weight: 500; }
.btn.primary:hover { background: var(--pj-accent-hover); border-color: var(--pj-accent-hover); }
.btn.danger:hover { color: var(--pj-danger); border-color: var(--pj-danger); background: var(--pj-danger-faint); }
.spacer { flex: 1; }
.saved { font-size: 12px; color: var(--pj-done); opacity: 0; transition: opacity 0.25s ease; white-space: nowrap; }
.saved.show { opacity: 1; }

/* ── 보드 ─────────────────────────────── */
.board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-items: start; }

.col {
  background: var(--pj-bg-surface);
  border: 1px solid var(--pj-border);
  border-radius: 14px;
  padding: 16px 14px 14px;
  min-height: 220px;
}
.col-head { display: flex; align-items: center; gap: 9px; padding: 0 4px 13px; border-bottom: 1px solid var(--pj-border); margin-bottom: 13px; }
.col-title { font-size: 15px; font-weight: 500; }
.col-count {
  font-size: 11px; color: var(--pj-text-secondary); background: var(--pj-bg-active);
  border-radius: 99px; padding: 1px 9px; font-variant-numeric: tabular-nums;
}
.col-add {
  font-family: inherit; font-size: 13px; color: var(--pj-text-muted);
  background: transparent; border: 1px dashed var(--pj-border-strong); border-radius: 10px;
  width: 100%; padding: 10px; cursor: pointer; transition: all 0.18s ease;
}
.col-add:hover { color: var(--pj-accent); border-color: var(--pj-accent); background: var(--pj-accent-faint); }

/* ── 카드 ─────────────────────────────── */
.card {
  background: var(--pj-bg-card);
  border: 1px solid var(--pj-border);
  border-radius: 11px;
  padding: 0 0 11px;
  margin-bottom: 10px;
  cursor: pointer;
  overflow: hidden;
  box-shadow: var(--pj-shadow-sm);
  transition: border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
}
.card:hover { border-color: var(--pj-border-strong); transform: translateY(-2px); box-shadow: var(--pj-shadow-md); }
.card.overdue { border-color: var(--pj-danger); }

.card-stripe { height: 3px; width: 100%; }
.card-body { padding: 12px 14px 0; }
.card-title { font-size: 15px; font-weight: 500; line-height: 1.45; margin-bottom: 3px; word-break: break-word; }
.card.is-done .card-title { color: var(--pj-text-muted); text-decoration: line-through; text-decoration-color: var(--pj-border-strong); }
.card-client { font-size: 12px; color: var(--pj-text-muted); margin-bottom: 10px; }
.card-empty-title { color: var(--pj-text-dim); font-style: italic; font-weight: 400; }

.card-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.chip {
  font-size: 11px; padding: 2px 8px; border-radius: 99px;
  background: var(--pj-bg-elevated); color: var(--pj-text-secondary);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.chip.soon { color: var(--pj-warn); background: var(--pj-warn-faint); }
.chip.over { color: var(--pj-danger); background: var(--pj-danger-faint); }
.chip.ok   { color: var(--pj-accent); background: var(--pj-accent-faint); }
.chip.paid { color: var(--pj-done); background: var(--pj-done-faint); }
.chip.prog.full { color: var(--pj-done); background: var(--pj-done-faint); }

.card-move { display: flex; gap: 5px; padding: 10px 14px 0; }
.mv {
  font-family: inherit; font-size: 12px; line-height: 1;
  color: var(--pj-text-muted); background: var(--pj-bg-elevated);
  border: 1px solid transparent; border-radius: 7px;
  padding: 5px 10px; cursor: pointer; transition: all 0.16s ease;
}
.mv:hover:not(:disabled) { color: var(--pj-accent); border-color: var(--pj-accent); background: var(--pj-accent-faint); }
.mv:disabled { opacity: 0.3; cursor: default; }
.mv.right { margin-left: auto; }

.col-empty { text-align: center; color: var(--pj-text-dim); font-size: 12px; padding: 18px 0 20px; }

/* ── 상세 모달 ─────────────────────────────── */
.overlay {
  position: fixed; inset: 0; background: var(--pj-scrim);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 20px; overflow-y: auto; z-index: 50;
}
.overlay[hidden] { display: none !important; }

.modal {
  background: var(--pj-bg-card);
  border: 1px solid var(--pj-border);
  border-radius: 16px;
  width: 100%; max-width: 640px;
  padding: 0 0 22px;
  overflow: hidden;
  box-shadow: var(--pj-shadow-lg);
}
.modal-stripe { height: 4px; width: 100%; }
.modal-inner { padding: 22px 26px 0; }

.m-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.m-label { font-size: 12px; color: var(--pj-text-muted); width: 62px; flex-shrink: 0; }

.f {
  font-family: inherit; font-weight: 400; color: var(--pj-text-primary);
  background: var(--pj-bg-elevated); border: 1px solid transparent;
  border-radius: 8px; padding: 7px 11px; transition: border-color 0.15s ease, background 0.15s ease;
}
.f:hover { border-color: var(--pj-border); }
.f:focus { outline: none; border-color: var(--pj-accent); background: var(--pj-bg-card); }
.f::placeholder { color: var(--pj-text-dim); }
.f-title { font-size: 20px; width: 100%; margin-bottom: 14px; font-weight: 500; }
.f-text { flex: 1; font-size: 14px; min-width: 120px; }
.f-sel { font-size: 13px; cursor: pointer; }
.f-date { font-size: 13px; }
.f-amount { font-size: 14px; width: 150px; text-align: right; font-variant-numeric: tabular-nums; }

.pay { display: flex; gap: 7px; }
.pay-btn {
  font-family: inherit; font-size: 12px; color: var(--pj-text-muted);
  background: var(--pj-bg-elevated); border: 1px solid transparent;
  border-radius: 99px; padding: 5px 14px; cursor: pointer; transition: all 0.16s ease;
}
.pay-btn:hover { border-color: var(--pj-border-strong); }
.pay-btn.on { background: var(--pj-done); color: var(--pj-text-on-fill); border-color: var(--pj-done); font-weight: 500; }

/* 할 일 */
.todo-head { display: flex; align-items: center; gap: 10px; margin: 20px 0 10px; }
.todo-title { font-size: 13px; color: var(--pj-text-secondary); font-weight: 500; }
.todo-prog { font-size: 12px; color: var(--pj-text-muted); font-variant-numeric: tabular-nums; }
.todo-bar { flex: 1; height: 4px; background: var(--pj-bg-active); border-radius: 99px; overflow: hidden; }
.todo-fill { height: 100%; width: 0; background: var(--pj-accent); border-radius: 99px; transition: width 0.3s ease; }
.todo-fill.full { background: var(--pj-done); }

.todo-item { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
.tbox {
  width: 18px; height: 18px; border: 1.5px solid var(--pj-border-strong);
  border-radius: 5px; flex-shrink: 0; position: relative; cursor: pointer;
  transition: all 0.16s ease;
}
.tbox:hover { border-color: var(--pj-accent); }
.tbox::after {
  content: ""; position: absolute; left: 5px; top: 1px;
  width: 5px; height: 10px;
  border-right: 2px solid var(--pj-text-on-fill); border-bottom: 2px solid var(--pj-text-on-fill);
  transform: rotate(45deg) scale(0); transition: transform 0.16s cubic-bezier(0.34,1.56,0.64,1);
}
.todo-item.on .tbox { background: var(--pj-done); border-color: var(--pj-done); }
.todo-item.on .tbox::after { transform: rotate(45deg) scale(1); }

.todo-text {
  flex: 1; font-size: 14px; background: transparent;
  border: 1px solid transparent; border-radius: 6px; padding: 3px 7px;
  color: var(--pj-text-primary); font-family: inherit; font-weight: 400;
}
.todo-text:hover { border-color: var(--pj-border); }
.todo-text:focus { outline: none; border-color: var(--pj-accent); background: var(--pj-bg-elevated); }
.todo-item.on .todo-text { color: var(--pj-text-muted); text-decoration: line-through; text-decoration-color: var(--pj-border-strong); }

.todo-del {
  font-family: inherit; font-size: 15px; line-height: 1; color: var(--pj-text-dim);
  background: transparent; border: none; cursor: pointer; padding: 3px 6px; border-radius: 5px;
  opacity: 0; transition: opacity 0.15s ease, color 0.15s ease;
}
.todo-item:hover .todo-del { opacity: 1; }
.todo-del:hover { color: var(--pj-danger); }

.todo-add { display: flex; gap: 8px; margin-top: 10px; }
.todo-add .f { flex: 1; font-size: 13px; }

/* 메모 */
.memo {
  display: block; width: 100%; min-height: 70px; resize: vertical;
  font-family: inherit; font-size: 13px; font-weight: 400; line-height: 1.65;
  color: var(--pj-text-primary); background: var(--pj-bg-elevated);
  border: 1px solid transparent; border-radius: 8px; padding: 9px 12px;
  transition: border-color 0.18s ease, background 0.18s ease;
}
.memo::placeholder { color: var(--pj-text-dim); }
.memo:hover { border-color: var(--pj-border); }
.memo:focus { outline: none; border-color: var(--pj-accent); background: var(--pj-bg-card); }

.modal-foot { display: flex; align-items: center; gap: 8px; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--pj-border); flex-wrap: wrap; }

.foot {
  margin-top: 38px; padding-top: 20px; border-top: 1px solid var(--pj-border);
  font-size: 12px; color: var(--pj-text-muted);
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}

@media print {
  body { background: var(--pj-bg-card); }
  .tools, .card-move, .col-add, .overlay, .foot { display: none; }
  .wrap { padding: 0; max-width: none; }
  .col, .card, .sum-card { box-shadow: none; border: 1px solid var(--pj-border-strong); break-inside: avoid; }
}

@media (max-width: 900px) {
  .summary { grid-template-columns: repeat(2, 1fr); }
  .board { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .wrap { padding: 40px 16px 80px; }
  .modal-inner { padding: 18px 18px 0; }
  .m-label { width: 100%; }
}
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow"><a href="../index.html">← KJC Studio</a></div>
  <h1>프로젝트 보드</h1>
  <p class="subtitle">클라이언트 작업을 카드로 관리합니다 · 카드를 누르면 상세가 열립니다</p>

  <div class="summary">
    <div class="sum-card">
      <div class="sum-label">진행중</div>
      <div class="sum-value accent" id="sumDoing">0<span class="sum-unit">건</span></div>
    </div>
    <div class="sum-card">
      <div class="sum-label">마감 임박 (7일 이내)</div>
      <div class="sum-value warn" id="sumSoon">0<span class="sum-unit">건</span></div>
    </div>
    <div class="sum-card">
      <div class="sum-label">미입금 (잔금 기준)</div>
      <div class="sum-value" id="sumMoney">0<span class="sum-unit">원</span></div>
    </div>
    <div class="sum-card">
      <div class="sum-label">완료</div>
      <div class="sum-value done" id="sumDone">0<span class="sum-unit">건</span></div>
    </div>
  </div>

  <div class="tools">
    <button class="btn primary" id="btnAdd">+ 새 프로젝트</button>
    <div class="spacer"></div>
    <button class="btn" id="btnExport">내보내기</button>
    <button class="btn" id="btnImport">가져오기</button>
    <button class="btn" id="btnPrint">인쇄</button>
    <span class="saved" id="savedTag">저장됨</span>
  </div>

  <div class="board" id="board"></div>

  <div class="foot">
    <span>입력 즉시 이 브라우저에 자동 저장됩니다. 다른 PC 로 옮기려면 <strong>내보내기</strong> 를 쓰세요.</span>
    <span>색상 수정: <code>projects/theme.css</code> · 칼럼 수정: <code>projects/data/config.js</code></span>
  </div>
</div>

<!-- 카드 상세 -->
<div class="overlay" id="overlay" hidden>
  <div class="modal" id="modal"></div>
</div>

<input type="file" id="fileInput" accept="application/json" hidden>

<script src="data/config.js"></script>
<script>
/* ==========================================================================
   프로젝트 목록은 localStorage 에 저장합니다.
   ========================================================================== */
const STORE_KEY = "kjc-projects-v1";

let projects = [];
let openId = null;   /* 현재 상세가 열려 있는 카드 id */

try { projects = JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch (e) { projects = []; }

const savedTag = document.getElementById("savedTag");
let savedTimer = null;

function save(flash) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(projects)); }
  catch (e) { return; }
  if (flash === false) return;
  savedTag.classList.add("show");
  clearTimeout(savedTimer);
  savedTimer = setTimeout(function () { savedTag.classList.remove("show"); }, 1100);
}

/* ── 보조 함수 ─────────────────────────────── */
function catOf(id) {
  for (var i = 0; i < CATEGORIES.length; i++) if (CATEGORIES[i].id === id) return CATEGORIES[i];
  return CATEGORIES[CATEGORIES.length - 1];
}

function daysLeft(dateStr) {
  if (!dateStr) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const due = new Date(dateStr + "T00:00:00");
  if (isNaN(due)) return null;
  return Math.round((due - today) / 86400000);
}

function ddayInfo(d) {
  if (d === null) return null;
  if (d < 0)  return { text: "D+" + Math.abs(d), cls: "over" };
  if (d === 0) return { text: "D-DAY", cls: "over" };
  if (d <= DUE_SOON_DAYS) return { text: "D-" + d, cls: "soon" };
  return { text: "D-" + d, cls: "ok" };
}

function won(n) { return (Number(n) || 0).toLocaleString("ko-KR"); }

function todoStat(p) {
  const list = p.todos || [];
  const done = list.filter(function (t) { return t.done; }).length;
  return { done: done, total: list.length, pct: list.length ? Math.round(done / list.length * 100) : 0 };
}

function byId(id) {
  for (var i = 0; i < projects.length; i++) if (projects[i].id === id) return projects[i];
  return null;
}

/* ── 보드 그리기 ─────────────────────────────── */
const boardEl = document.getElementById("board");

function renderBoard() {
  boardEl.innerHTML = "";

  COLUMNS.forEach(function (col, colIdx) {
    const colEl = document.createElement("div");
    colEl.className = "col";

    const rows = projects.filter(function (p) { return (p.column || COLUMNS[0].id) === col.id; });

    const head = document.createElement("div");
    head.className = "col-head";
    head.innerHTML = '<span class="col-title"></span><span class="col-count">' + rows.length + '</span>';
    head.querySelector(".col-title").textContent = col.label;
    colEl.appendChild(head);

    if (!rows.length) {
      const e = document.createElement("div");
      e.className = "col-empty";
      e.textContent = "비어 있음";
      colEl.appendChild(e);
    }

    rows.forEach(function (p) { colEl.appendChild(buildCard(p, colIdx)); });

    const add = document.createElement("button");
    add.className = "col-add";
    add.textContent = "+ 카드 추가";
    add.addEventListener("click", function () { addProject(col.id); });
    colEl.appendChild(add);

    boardEl.appendChild(colEl);
  });

  updateSummary();
}

/* ── 카드 한 장 ─────────────────────────────── */
function buildCard(p, colIdx) {
  const card = document.createElement("div");
  const cat = catOf(p.category);
  const d = daysLeft(p.due);
  const isDone = (p.column === "done");

  card.className = "card" + (isDone ? " is-done" : "")
    + (!isDone && d !== null && d < 0 ? " overdue" : "");

  const stripe = document.createElement("div");
  stripe.className = "card-stripe";
  stripe.style.background = cat.color;
  card.appendChild(stripe);

  const body = document.createElement("div");
  body.className = "card-body";

  const title = document.createElement("div");
  title.className = "card-title" + (p.title ? "" : " card-empty-title");
  title.textContent = p.title || "제목 없음";
  body.appendChild(title);

  if (p.client) {
    const cl = document.createElement("div");
    cl.className = "card-client";
    cl.textContent = p.client;
    body.appendChild(cl);
  }

  const meta = document.createElement("div");
  meta.className = "card-meta";

  const st = todoStat(p);
  if (st.total) {
    const c = document.createElement("span");
    c.className = "chip prog" + (st.done === st.total ? " full" : "");
    c.textContent = "☑ " + st.done + "/" + st.total;
    meta.appendChild(c);
  }

  const dd = ddayInfo(d);
  if (dd && !isDone) {
    const c = document.createElement("span");
    c.className = "chip " + dd.cls;
    c.textContent = dd.text;
    meta.appendChild(c);
  }

  if (p.amount) {
    const c = document.createElement("span");
    const paid = p.balance;
    c.className = "chip" + (paid ? " paid" : "");
    c.textContent = paid ? "입금 완료" : won(p.amount) + "원";
    meta.appendChild(c);
  }

  body.appendChild(meta);
  card.appendChild(body);

  card.addEventListener("click", function () { openModal(p.id); });

  /* 칼럼 이동 버튼 */
  const move = document.createElement("div");
  move.className = "card-move";

  const left = document.createElement("button");
  left.className = "mv";
  left.textContent = "‹";
  left.title = "왼쪽 칼럼으로";
  left.disabled = colIdx === 0;
  left.addEventListener("click", function (e) {
    e.stopPropagation();
    p.column = COLUMNS[colIdx - 1].id;
    save(); renderBoard();
  });
  move.appendChild(left);

  const right = document.createElement("button");
  right.className = "mv right";
  right.textContent = "›";
  right.title = "오른쪽 칼럼으로";
  right.disabled = colIdx === COLUMNS.length - 1;
  right.addEventListener("click", function (e) {
    e.stopPropagation();
    p.column = COLUMNS[colIdx + 1].id;
    save(); renderBoard();
  });
  move.appendChild(right);

  card.appendChild(move);
  return card;
}

/* ── 요약 ─────────────────────────────── */
function updateSummary() {
  const doing = projects.filter(function (p) { return p.column === "doing"; });
  const doneN = projects.filter(function (p) { return p.column === "done"; }).length;
  const live  = projects.filter(function (p) { return p.column !== "done"; });

  const soon = live.filter(function (p) {
    const d = daysLeft(p.due);
    return d !== null && d <= DUE_SOON_DAYS;
  }).length;

  const unpaid = live.reduce(function (s, p) {
    return p.balance ? s : s + (Number(p.amount) || 0);
  }, 0);

  document.getElementById("sumDoing").innerHTML = doing.length + '<span class="sum-unit">건</span>';
  document.getElementById("sumSoon").innerHTML  = soon + '<span class="sum-unit">건</span>';
  document.getElementById("sumMoney").innerHTML = won(unpaid) + '<span class="sum-unit">원</span>';
  document.getElementById("sumDone").innerHTML  = doneN + '<span class="sum-unit">건</span>';
}

/* ── 카드 추가 ─────────────────────────────── */
function addProject(colId) {
  const p = {
    id: "p" + Date.now(),
    title: "", client: "",
    category: CATEGORIES[0].id,
    column: colId || COLUMNS[0].id,
    due: "", amount: 0,
    deposit: false, balance: false,
    todos: [], memo: "",
    createdAt: Date.now()
  };
  projects.push(p);
  save();
  renderBoard();
  openModal(p.id);
}

/* ── 상세 모달 ─────────────────────────────── */
const overlay = document.getElementById("overlay");
const modal = document.getElementById("modal");

function openModal(id) {
  openId = id;
  drawModal();
  overlay.hidden = false;
  const t = modal.querySelector(".f-title");
  if (t && !t.value) t.focus();
}

function closeModal() {
  openId = null;
  overlay.hidden = true;
  renderBoard();
}

overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !overlay.hidden) closeModal(); });

function drawModal() {
  const p = byId(openId);
  if (!p) { closeModal(); return; }
  const cat = catOf(p.category);

  modal.innerHTML = '<div class="modal-stripe"></div><div class="modal-inner"></div>';
  modal.querySelector(".modal-stripe").style.background = cat.color;
  const box = modal.querySelector(".modal-inner");

  /* 제목 */
  const title = document.createElement("input");
  title.className = "f f-title";
  title.placeholder = "프로젝트명";
  title.value = p.title || "";
  title.addEventListener("input", function () { p.title = title.value; save(); });
  box.appendChild(title);

  /* 클라이언트 + 카테고리 */
  const r1 = document.createElement("div");
  r1.className = "m-row";
  r1.innerHTML = '<span class="m-label">클라이언트</span>';

  const client = document.createElement("input");
  client.className = "f f-text";
  client.placeholder = "클라이언트명";
  client.value = p.client || "";
  client.addEventListener("input", function () { p.client = client.value; save(); });
  r1.appendChild(client);

  const catSel = document.createElement("select");
  catSel.className = "f f-sel";
  CATEGORIES.forEach(function (c) {
    const o = document.createElement("option");
    o.value = c.id; o.textContent = c.label;
    if (p.category === c.id) o.selected = true;
    catSel.appendChild(o);
  });
  catSel.addEventListener("change", function () {
    p.category = catSel.value;
    save();
    modal.querySelector(".modal-stripe").style.background = catOf(p.category).color;
  });
  r1.appendChild(catSel);
  box.appendChild(r1);

  /* 마감일 */
  const r2 = document.createElement("div");
  r2.className = "m-row";
  r2.innerHTML = '<span class="m-label">마감일</span>';

  const due = document.createElement("input");
  due.type = "date";
  due.className = "f f-date";
  due.value = p.due || "";
  due.addEventListener("change", function () { p.due = due.value; save(); drawDday(); });
  r2.appendChild(due);

  const ddaySpan = document.createElement("span");
  ddaySpan.className = "chip";
  r2.appendChild(ddaySpan);
  box.appendChild(r2);

  function drawDday() {
    const info = ddayInfo(daysLeft(p.due));
    ddaySpan.className = "chip " + (info ? info.cls : "");
    ddaySpan.textContent = info ? info.text : "마감일 없음";
  }
  drawDday();

  /* 금액 + 입금 */
  const r3 = document.createElement("div");
  r3.className = "m-row";
  r3.innerHTML = '<span class="m-label">금액</span>';

  const amount = document.createElement("input");
  amount.className = "f f-amount";
  amount.placeholder = "0";
  amount.value = p.amount ? won(p.amount) : "";
  amount.addEventListener("input", function () {
    const raw = amount.value.replace(/[^0-9]/g, "");
    p.amount = raw ? Number(raw) : 0;
    amount.value = raw ? won(raw) : "";
    save();
  });
  r3.appendChild(amount);

  const wonTxt = document.createElement("span");
  wonTxt.className = "todo-prog";
  wonTxt.textContent = "원";
  r3.appendChild(wonTxt);

  const pay = document.createElement("div");
  pay.className = "pay";
  [["deposit", "선금"], ["balance", "잔금"]].forEach(function (pair) {
    const b = document.createElement("button");
    b.className = "pay-btn" + (p[pair[0]] ? " on" : "");
    b.textContent = pair[1];
    b.addEventListener("click", function () {
      p[pair[0]] = !p[pair[0]];
      b.classList.toggle("on", !!p[pair[0]]);
      save();
    });
    pay.appendChild(b);
  });
  r3.appendChild(pay);
  box.appendChild(r3);

  /* 할 일 */
  if (!p.todos) p.todos = [];

  const th = document.createElement("div");
  th.className = "todo-head";
  th.innerHTML = '<span class="todo-title">할 일</span>'
    + '<div class="todo-bar"><div class="todo-fill"></div></div>'
    + '<span class="todo-prog"></span>';
  box.appendChild(th);

  const todoList = document.createElement("div");
  box.appendChild(todoList);

  function refreshProg() {
    const st = todoStat(p);
    const fill = th.querySelector(".todo-fill");
    fill.style.width = st.pct + "%";
    fill.classList.toggle("full", st.total > 0 && st.done === st.total);
    th.querySelector(".todo-prog").textContent = st.total ? st.done + "/" + st.total + " · " + st.pct + "%" : "없음";
  }

  function drawTodos() {
    todoList.innerHTML = "";
    p.todos.forEach(function (t) {
      const row = document.createElement("div");
      row.className = "todo-item" + (t.done ? " on" : "");

      const box2 = document.createElement("div");
      box2.className = "tbox";
      box2.addEventListener("click", function () {
        t.done = !t.done;
        row.classList.toggle("on", !!t.done);
        save();
        refreshProg();
      });
      row.appendChild(box2);

      const txt = document.createElement("input");
      txt.className = "todo-text";
      txt.value = t.text || "";
      txt.addEventListener("input", function () { t.text = txt.value; save(); });
      row.appendChild(txt);

      const del = document.createElement("button");
      del.className = "todo-del";
      del.textContent = "×";
      del.title = "이 할 일 삭제";
      del.addEventListener("click", function () {
        p.todos = p.todos.filter(function (x) { return x.id !== t.id; });
        save();
        drawTodos();
        refreshProg();
      });
      row.appendChild(del);

      todoList.appendChild(row);
    });
  }
  drawTodos();
  refreshProg();

  /* 할 일 추가 */
  const addRow = document.createElement("div");
  addRow.className = "todo-add";

  const addInput = document.createElement("input");
  addInput.className = "f";
  addInput.placeholder = "할 일을 입력하고 Enter";
  addRow.appendChild(addInput);

  function addTodo() {
    const v = addInput.value.trim();
    if (!v) return;
    p.todos.push({ id: "t" + Date.now() + Math.random().toString(36).slice(2, 6), text: v, done: false });
    addInput.value = "";
    save();
    drawTodos();
    refreshProg();
    addInput.focus();
  }
  addInput.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); addTodo(); } });

  const addBtn = document.createElement("button");
  addBtn.className = "btn";
  addBtn.textContent = "추가";
  addBtn.addEventListener("click", addTodo);
  addRow.appendChild(addBtn);

  const tplBtn = document.createElement("button");
  tplBtn.className = "btn";
  tplBtn.textContent = "기본 세트";
  tplBtn.title = "자주 쓰는 할 일을 한 번에 넣습니다";
  tplBtn.addEventListener("click", function () {
    TODO_TEMPLATE.forEach(function (t, i) {
      p.todos.push({ id: "t" + Date.now() + "_" + i, text: t, done: false });
    });
    save();
    drawTodos();
    refreshProg();
  });
  addRow.appendChild(tplBtn);
  box.appendChild(addRow);

  /* 메모 */
  const mh = document.createElement("div");
  mh.className = "todo-head";
  mh.innerHTML = '<span class="todo-title">메모</span>';
  box.appendChild(mh);

  const memo = document.createElement("textarea");
  memo.className = "memo";
  memo.placeholder = "요청사항, 수정 내역, 다음에 할 일 등";
  memo.value = p.memo || "";
  memo.addEventListener("input", function () { p.memo = memo.value; save(); });
  box.appendChild(memo);

  /* 아래 버튼 */
  const foot = document.createElement("div");
  foot.className = "modal-foot";

  COLUMNS.forEach(function (c) {
    const b = document.createElement("button");
    b.className = "btn" + (p.column === c.id ? " primary" : "");
    b.textContent = c.label;
    b.addEventListener("click", function () {
      p.column = c.id;
      save();
      drawModal();
    });
    foot.appendChild(b);
  });

  const sp = document.createElement("div");
  sp.className = "spacer";
  foot.appendChild(sp);

  const del = document.createElement("button");
  del.className = "btn danger";
  del.textContent = "삭제";
  del.addEventListener("click", function () {
    if (!confirm((p.title || "이 프로젝트") + " 를(을) 삭제합니다. 되돌릴 수 없습니다. 계속할까요?")) return;
    projects = projects.filter(function (x) { return x.id !== p.id; });
    save();
    closeModal();
  });
  foot.appendChild(del);

  const close = document.createElement("button");
  close.className = "btn";
  close.textContent = "닫기";
  close.addEventListener("click", closeModal);
  foot.appendChild(close);

  box.appendChild(foot);
}

/* ── 도구 ─────────────────────────────── */
document.getElementById("btnAdd").addEventListener("click", function () { addProject(COLUMNS[0].id); });
document.getElementById("btnPrint").addEventListener("click", function () { window.print(); });

document.getElementById("btnExport").addEventListener("click", function () {
  const blob = new Blob([JSON.stringify(projects, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const d = new Date();
  const stamp = d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
  a.href = url;
  a.download = "kjc-projects-" + stamp + ".json";
  a.click();
  URL.revokeObjectURL(url);
});

const fileInput = document.getElementById("fileInput");
document.getElementById("btnImport").addEventListener("click", function () { fileInput.click(); });

fileInput.addEventListener("change", function () {
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function () {
    let data;
    try { data = JSON.parse(reader.result); }
    catch (e) { alert("읽을 수 없는 파일입니다. 내보내기로 만든 JSON 파일인지 확인하세요."); return; }
    if (!Array.isArray(data)) { alert("프로젝트 목록 형식이 아닙니다."); return; }

    const merge = confirm(
      "불러온 프로젝트 " + data.length + "건.\n\n"
      + "[확인] 기존 목록에 합치기 (같은 항목은 덮어씀)\n"
      + "[취소] 기존 목록을 지우고 이것만 쓰기"
    );

    if (merge) {
      data.forEach(function (item) {
        const i = projects.findIndex(function (p) { return p.id === item.id; });
        if (i >= 0) projects[i] = item; else projects.push(item);
      });
    } else {
      projects = data;
    }
    save();
    renderBoard();
    alert("불러왔습니다.");
  };
  reader.readAsText(file);
  fileInput.value = "";
});

renderBoard();
</script>
