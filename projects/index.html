<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로젝트 보드 · KJC Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- 색상·모서리 값은 theme.css 한 곳에서만 정합니다 -->
<link rel="stylesheet" href="theme.css">

<style>
/* ==========================================================================
   KJC Studio · 프로젝트 보드 — 레이아웃

   구조
     프로젝트 탭 (가로로 쌓임)
       └ 선택된 탭과 이어진 흰 패널
           └ 할 일 / 진행중 / 완료 (회색 칸)
               └ 작업 카드 (흰 블록)

   토스증권 화면 구성을 따릅니다: 회색 바탕 → 흰 패널 → 회색 칸 → 흰 블록
   색·모서리 값은 이 파일에 직접 쓰지 않습니다. 전부 theme.css 의 변수를 씁니다.
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--pj-bg);
  color: var(--pj-text-primary);
  font-family: var(--pj-font-body);
  font-weight: 400;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
}

.wrap { max-width: 1400px; margin: 0 auto; padding: 32px 24px 80px; }

/* ── 상단 ─────────────────────────────── */
.topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.back {
  font-size: 14px; font-weight: 500; color: var(--pj-text-secondary);
  text-decoration: none; padding: 7px 12px; border-radius: var(--pj-radius-sm);
  transition: background 0.15s ease, color 0.15s ease;
}
.back:hover { background: var(--pj-bg-surface); color: var(--pj-text-primary); }

h1 {
  font-size: clamp(24px, 3.5vw, 30px);
  font-weight: 700; letter-spacing: -0.035em; line-height: 1.25;
  margin-bottom: 6px;
}
.subtitle { color: var(--pj-text-secondary); font-size: 14px; }
.head-block { margin-bottom: 22px; padding-left: 2px; }

/* ── 요약 타일 ─────────────────────────────── */
.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.sum-card { background: var(--pj-bg-card); border-radius: var(--pj-radius-lg); padding: 18px 20px; }
.sum-label { font-size: 13px; font-weight: 500; color: var(--pj-text-secondary); margin-bottom: 6px; }
.sum-value {
  font-size: 24px; font-weight: 700; line-height: 1.2;
  letter-spacing: -0.03em; font-variant-numeric: tabular-nums;
}
.sum-value.accent { color: var(--pj-accent); }
.sum-value.warn { color: var(--pj-warn); }
.sum-value.done { color: var(--pj-done); }
.sum-unit { font-size: 14px; font-weight: 600; color: var(--pj-text-dim); margin-left: 3px; }

/* 저장 상태 표시 — 서버까지 갔는지 브라우저에만 있는지 구분해서 보여줍니다 */
.saved {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 600; color: var(--pj-text-muted);
  white-space: nowrap; margin-left: auto; align-self: center;
  padding: 6px 12px; border-radius: var(--pj-radius-sm);
  background: var(--pj-bg-elevated);
  transition: color 0.2s ease, background 0.2s ease, opacity 0.2s ease;
}
.saved::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: currentColor; flex-shrink: 0;
}
.saved.ok   { color: var(--pj-done); background: var(--pj-done-faint); }
.saved.warn { color: var(--pj-warn); background: var(--pj-warn-faint); }
.saved.busy { color: var(--pj-accent); background: var(--pj-accent-faint); }

/* ══════════════════════════════════════════
   프로젝트 탭 — 새로 만들면 오른쪽으로 붙습니다
   ══════════════════════════════════════════ */
.tabrow {
  display: flex; align-items: flex-end; gap: 4px;
  overflow-x: auto; padding-top: 2px;
  scrollbar-width: none;
}
.tabrow::-webkit-scrollbar { display: none; }

.tab {
  display: flex; align-items: center; gap: 7px;
  background: var(--pj-bg-elevated); color: var(--pj-text-secondary);
  border: none; border-radius: var(--pj-radius-md) var(--pj-radius-md) 0 0;
  padding: 11px 17px 12px;
  font-family: inherit; font-size: 14px; font-weight: 600;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
  transition: background 0.15s ease, color 0.15s ease;
}
.tab:hover { background: var(--pj-bg-active); color: var(--pj-text-primary); }

.tab-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pj-text-dim); flex-shrink: 0; }
.tab-cnt { font-size: 12px; font-weight: 600; color: var(--pj-text-dim); font-variant-numeric: tabular-nums; }

/* 선택된 탭 — 아래 패널과 색이 이어져 한 덩어리로 보입니다 */
.tab.on {
  background: var(--pj-bg-card); color: var(--pj-text-primary);
  padding-bottom: 14px; margin-bottom: -2px; z-index: 2; position: relative;
}
.tab.on .tab-dot { background: var(--pj-accent); }
.tab.on .tab-cnt { color: var(--pj-text-muted); }

.tab-add {
  background: transparent; border: none; color: var(--pj-text-muted);
  font-family: inherit; font-size: 14px; font-weight: 600;
  padding: 11px 16px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
  border-radius: var(--pj-radius-md) var(--pj-radius-md) 0 0;
  transition: background 0.15s ease, color 0.15s ease;
}
.tab-add:hover { background: var(--pj-accent-faint); color: var(--pj-accent); }

/* ══ 선택된 프로젝트 패널 ══ */
.panel {
  background: var(--pj-bg-card);
  border-radius: 0 var(--pj-radius-lg) var(--pj-radius-lg) var(--pj-radius-lg);
  padding: 22px 22px 20px;
  position: relative; z-index: 1;
}

.p-head { display: flex; align-items: center; gap: 11px; flex-wrap: wrap; margin-bottom: 14px; }

.p-name {
  flex: 1; min-width: 200px;
  font-family: inherit; font-size: 21px; font-weight: 700;
  letter-spacing: -0.03em; color: var(--pj-text-primary);
  background: transparent; border: none;
  border-radius: var(--pj-radius-sm); padding: 5px 9px; margin-left: -9px;
  transition: background 0.15s ease;
}
.p-name:hover { background: var(--pj-bg-elevated); }
.p-name:focus { outline: none; background: var(--pj-bg-elevated); box-shadow: inset 0 0 0 2px var(--pj-accent); }
.p-name::placeholder { color: var(--pj-text-dim); font-weight: 700; }

.p-prog { font-size: 13px; font-weight: 600; color: var(--pj-text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

.icon-btn {
  font-family: inherit; font-size: 13px; font-weight: 600; line-height: 1;
  color: var(--pj-text-muted); background: var(--pj-bg-elevated);
  border: none; border-radius: var(--pj-radius-sm);
  padding: 9px 13px; cursor: pointer; white-space: nowrap;
  transition: background 0.15s ease, color 0.15s ease;
}
.icon-btn:hover { background: var(--pj-bg-active); color: var(--pj-text-primary); }
.icon-btn.del:hover { background: var(--pj-danger-faint); color: var(--pj-danger); }

/* 진행률 막대 */
.p-bar { height: 6px; background: var(--pj-bg-elevated); border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
.p-fill { height: 100%; width: 0; background: var(--pj-accent); border-radius: 99px; transition: width 0.3s ease; }
.p-fill.full { background: var(--pj-done); }

/* ── 3칸 ─────────────────────────────── */
.lanes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

.lane {
  background: var(--pj-bg);
  border-radius: var(--pj-radius-md);
  padding: 12px 11px 11px;
  min-height: 130px;
}
.lane-head { display: flex; align-items: center; gap: 7px; margin-bottom: 10px; }
.lane-title {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 600; letter-spacing: -0.02em;
  padding: 5px 11px; border-radius: var(--pj-radius-sm);
  background: var(--pj-bg-elevated); color: var(--pj-text-strong);
}
.lane-title.tone-accent { background: var(--pj-accent-faint); color: var(--pj-accent); }
.lane-title.tone-done   { background: var(--pj-done-faint);   color: var(--pj-done); }
.lane-title::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: currentColor; flex-shrink: 0;
}
.lane-count { font-size: 12px; font-weight: 600; color: var(--pj-text-dim); font-variant-numeric: tabular-nums; }

.lane-add {
  font-family: inherit; font-size: 13px; font-weight: 600;
  color: var(--pj-text-muted); background: transparent;
  border: none; border-radius: var(--pj-radius-sm);
  width: 100%; padding: 9px; cursor: pointer; text-align: left;
  transition: background 0.15s ease, color 0.15s ease;
}
.lane-add:hover { background: var(--pj-accent-faint); color: var(--pj-accent); }

.lane-empty { text-align: center; color: var(--pj-text-dim); font-size: 12px; font-weight: 500; padding: 12px 0 14px; }

/* ── 작업 카드 ─────────────────────────────── */
.task {
  background: var(--pj-bg-card);
  border-radius: var(--pj-radius-sm);
  padding: 9px 10px;
  margin-bottom: 6px;
  display: flex; align-items: flex-start; gap: 6px;
}
.task-text {
  flex: 1; font-family: inherit; font-size: 13px; font-weight: 500;
  line-height: 1.5; color: var(--pj-text-primary);
  background: transparent; border: none; border-radius: 5px; padding: 2px 3px;
  resize: none; overflow: hidden; min-height: 21px;
}
.task-text:focus { outline: none; box-shadow: inset 0 0 0 2px var(--pj-accent); }
.task-text::placeholder { color: var(--pj-text-dim); font-weight: 400; }
.task.is-done .task-text { color: var(--pj-text-dim); text-decoration: line-through; }

.task-btns { display: flex; gap: 2px; flex-shrink: 0; }
.tb {
  font-family: inherit; font-size: 12px; font-weight: 600; line-height: 1;
  color: var(--pj-text-dim); background: transparent;
  border: none; border-radius: 5px; padding: 4px 6px; cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}
.tb:hover:not(:disabled) { background: var(--pj-accent-faint); color: var(--pj-accent); }
.tb.del:hover { background: var(--pj-danger-faint); color: var(--pj-danger); }
.tb:disabled { opacity: 0.25; cursor: default; }

/* 메모 */
.memo {
  display: block; width: 100%; min-height: 48px; resize: vertical;
  margin-top: 12px;
  font-family: inherit; font-size: 13px; font-weight: 500; line-height: 1.6;
  color: var(--pj-text-primary); background: var(--pj-bg-elevated);
  border: none; border-radius: var(--pj-radius-md); padding: 11px 13px;
  transition: box-shadow 0.15s ease;
}
.memo::placeholder { color: var(--pj-text-dim); font-weight: 400; }
.memo:focus { outline: none; box-shadow: inset 0 0 0 2px var(--pj-accent); }

/* 빈 상태 */
.empty {
  background: var(--pj-bg-card); border-radius: var(--pj-radius-lg);
  text-align: center; padding: 70px 20px;
}
.empty-title { font-size: 17px; font-weight: 700; margin-bottom: 7px; }
.empty-desc { font-size: 14px; color: var(--pj-text-secondary); }

@media print {
  .lane-add, .task-btns, .back, .icon-btn, .tab-add { display: none; }
  .wrap { padding: 0; max-width: none; }
  .panel, .lane, .task { break-inside: avoid; }
}

@media (max-width: 900px) {
  .summary { grid-template-columns: repeat(2, 1fr); }
  .lanes { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .wrap { padding: 24px 14px 70px; }
  .panel { padding: 18px 15px 16px; }
}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <a class="back" href="../index.html">← KJC Studio</a>
    <span class="saved" id="savedTag">불러오는 중…</span>
  </div>

  <div class="head-block">
    <h1>프로젝트 보드</h1>
    <p class="subtitle">프로젝트마다 할 일 · 진행중 · 완료를 따로 관리합니다</p>
  </div>

  <div class="summary">
    <div class="sum-card">
      <div class="sum-label">전체 프로젝트</div>
      <div class="sum-value accent" id="sumTotal">0<span class="sum-unit">개</span></div>
    </div>
    <div class="sum-card">
      <div class="sum-label">진행중 작업</div>
      <div class="sum-value warn" id="sumDoing">0<span class="sum-unit">개</span></div>
    </div>
    <div class="sum-card">
      <div class="sum-label">남은 작업</div>
      <div class="sum-value" id="sumLeft">0<span class="sum-unit">개</span></div>
    </div>
    <div class="sum-card">
      <div class="sum-label">완료된 프로젝트</div>
      <div class="sum-value done" id="sumDone">0<span class="sum-unit">개</span></div>
    </div>
  </div>

  <div class="tabrow" id="tabrow"></div>
  <div id="panelHost"></div>
</div>

<script src="data/config.js"></script>
<script>
/* ==========================================================================
   데이터 구조
     프로젝트 { id, name, client, due, amount, deposit, balance, memo, tasks[] }
     작업     { id, text, column }
   localStorage 에 저장합니다.
   ========================================================================== */
const STORE_KEY  = "kjc-projects-v2";
const OLD_KEY    = "kjc-projects-v1";
const ACTIVE_KEY = "kjc-projects-active-v2";

let projects = [];
let activeId = null;

/* 지금 입력 중인 작업 id — 화면을 다시 그려도 커서를 잃지 않게 기억해 둡니다 */
let focusedTaskId = null;

/* ── 불러오기 (예전 구조는 자동 변환) ─────────────────────────────── */
function load() {
  try {
    const cur = JSON.parse(localStorage.getItem(STORE_KEY));
    if (Array.isArray(cur)) return cur;
  } catch (e) { /* 아래에서 예전 데이터 확인 */ }

  /* 예전 구조: 카드 하나 = 클라이언트 작업, 그 안에 todos[] 가 있었습니다.
     카드를 프로젝트로 올리고 todos 를 작업 카드로 내립니다. */
  try {
    const old = JSON.parse(localStorage.getItem(OLD_KEY));
    if (Array.isArray(old) && old.length) {
      return old.map(function (o) {
        return {
          id: o.id || ("p" + Date.now() + Math.random().toString(36).slice(2, 6)),
          name: o.title || "",
          client: o.client || "",
          due: o.due || "",
          amount: o.amount || 0,
          deposit: !!o.deposit,
          balance: !!o.balance,
          memo: o.memo || "",
          createdAt: o.createdAt || Date.now(),
          tasks: (o.todos || []).map(function (t, i) {
            return {
              id: t.id || ("t" + Date.now() + "_" + i),
              text: t.text || "",
              column: t.done ? "done" : (o.column === "doing" ? "doing" : "todo")
            };
          })
        };
      });
    }
  } catch (e) { /* 변환 실패 시 빈 목록 */ }

  return [];
}

projects = load();
try { activeId = localStorage.getItem(ACTIVE_KEY) || null; } catch (e) { activeId = null; }
if (!byId(activeId) && projects.length) activeId = projects[0].id;

/* ══════════════════════════════════════════
   저장
     1. 브라우저에 즉시 저장 (전기가 나가도 안 잃게)
     2. 서버에는 1초 모아서 한 번 보냄 (타이핑마다 부르지 않으려고)
     서버가 없거나 실패해도 화면은 그대로 동작합니다.
   ══════════════════════════════════════════ */
const API = "/api/board";
const SYNC_DELAY = 1000;

const savedTag = document.getElementById("savedTag");
let syncTimer = null;
let syncing = false;
let pending = false;      /* 저장 중에 또 바뀌었는지 */
let serverAlive = null;   /* null 아직 모름 · true 서버 저장됨 · false 브라우저만 */

function setStatus(text, cls) {
  savedTag.textContent = text;
  savedTag.className = "saved" + (cls ? " " + cls : "");
}

function persistLocal() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(projects));
    if (activeId) localStorage.setItem(ACTIVE_KEY, activeId);
  } catch (e) { /* 저장이 막힌 환경이어도 화면은 동작합니다 */ }
}

function save(flash) {
  persistLocal();
  scheduleSync();
  if (flash !== false && serverAlive !== false) setStatus("저장 중…", "busy");
}

function scheduleSync() {
  if (syncing) { pending = true; return; }
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncToServer, SYNC_DELAY);
}

function syncToServer() {
  syncing = true;
  pending = false;

  fetch(API, {
    method: "PUT",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ data: { projects: projects, activeId: activeId } })
  })
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function () {
      serverAlive = true;
      setStatus("서버에 저장됨", "ok");
    })
    .catch(function () {
      serverAlive = false;
      setStatus("이 브라우저에만 저장됨", "warn");
    })
    .then(function () {
      syncing = false;
      if (pending) scheduleSync();
    });
}

/* 서버에서 불러오기 — 실패하면 브라우저에 있던 내용으로 갑니다 */
function loadFromServer() {
  return fetch(API, { headers: { accept: "application/json" } })
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function (body) {
      serverAlive = true;

      if (body && body.ok && body.data && Array.isArray(body.data.projects)) {
        projects = body.data.projects;
        if (body.data.activeId) activeId = body.data.activeId;
        if (!byId(activeId) && projects.length) activeId = projects[0].id;
        persistLocal();
        setStatus("서버에서 불러옴", "ok");
        render();
        return;
      }

      /* 서버에 아직 아무것도 없으면, 이 브라우저에 있던 내용을 올려 둡니다 */
      setStatus("서버 연결됨", "ok");
      if (projects.length) scheduleSync();
    })
    .catch(function () {
      serverAlive = false;
      setStatus("이 브라우저에만 저장됨", "warn");
    });
}

/* ── 보조 함수 ─────────────────────────────── */
function byId(id) {
  if (!id) return null;
  for (var i = 0; i < projects.length; i++) if (projects[i].id === id) return projects[i];
  return null;
}

function lastColId() { return COLUMNS[COLUMNS.length - 1].id; }

/* 어느 칸에 든 작업이 몇 개인지 (전체 프로젝트 합계) */
function countIn(colId) {
  return projects.reduce(function (s, p) {
    return s + (p.tasks || []).filter(function (t) { return (t.column || COLUMNS[0].id) === colId; }).length;
  }, 0);
}

function progOf(p) {
  const list = p.tasks || [];
  const done = list.filter(function (t) { return t.column === lastColId(); }).length;
  return { done: done, total: list.length, pct: list.length ? Math.round(done / list.length * 100) : 0 };
}

function isFinished(p) {
  const st = progOf(p);
  return st.total > 0 && st.done === st.total;
}

function autoGrow(el) {
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}

/* ── 화면 그리기 ─────────────────────────────── */
const tabrow = document.getElementById("tabrow");
const panelHost = document.getElementById("panelHost");

function render() {
  drawTabs();
  drawPanel();
  updateSummary();
  restoreFocus();
}

/* 화면을 다시 그린 뒤, 입력 중이던 작업으로 커서를 되돌립니다.
   (어떤 이유로든 다시 그려져도 글 쓰던 칸에서 튕겨 나가지 않게 하는 안전장치) */
function restoreFocus() {
  if (!focusedTaskId) return;
  const el = panelHost.querySelector('[data-task-id="' + focusedTaskId + '"]');
  if (!el || document.activeElement === el) return;
  el.focus();
  try {
    const n = el.value.length;
    el.setSelectionRange(n, n);
  } catch (e) { /* 커서 위치 지정을 못 해도 포커스는 살아 있습니다 */ }
}

/* ── 탭 줄 ─────────────────────────────── */
function drawTabs() {
  tabrow.innerHTML = "";

  projects.forEach(function (p) {
    const st = progOf(p);

    const tab = document.createElement("button");
    tab.className = "tab" + (p.id === activeId ? " on" : "");

    const dot = document.createElement("span");
    dot.className = "tab-dot";
    tab.appendChild(dot);

    const nm = document.createElement("span");
    nm.textContent = p.name || "이름 없음";
    tab.appendChild(nm);

    if (st.total) {
      const cnt = document.createElement("span");
      cnt.className = "tab-cnt";
      cnt.textContent = st.done + "/" + st.total;
      tab.appendChild(cnt);
    }

    tab.addEventListener("click", function () {
      activeId = p.id;
      save(false);
      render();
    });

    tabrow.appendChild(tab);
  });

  const add = document.createElement("button");
  add.className = "tab-add";
  add.textContent = "+ 새 프로젝트";
  add.addEventListener("click", addProject);
  tabrow.appendChild(add);
}

/* ── 선택된 프로젝트 패널 ─────────────────────────────── */
function drawPanel() {
  panelHost.innerHTML = "";

  const p = byId(activeId);
  if (!p) {
    const e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = '<div class="empty-title">아직 프로젝트가 없습니다</div>'
      + '<div class="empty-desc">위의 <strong>+ 새 프로젝트</strong> 를 눌러 시작하세요.</div>';
    panelHost.appendChild(e);
    return;
  }

  const panel = document.createElement("div");
  panel.className = "panel";

  /* ── 제목 줄 ── */
  const head = document.createElement("div");
  head.className = "p-head";

  const name = document.createElement("input");
  name.className = "p-name";
  name.placeholder = "프로젝트 이름을 입력하세요";
  name.value = p.name || "";
  name.addEventListener("input", function () {
    p.name = name.value;
    save();
    drawTabs();          /* 탭 이름도 같이 바뀝니다 */
  });
  head.appendChild(name);

  const st = progOf(p);
  const prog = document.createElement("span");
  prog.className = "p-prog";
  prog.textContent = st.total ? st.done + "/" + st.total + " · " + st.pct + "%" : "작업 없음";
  head.appendChild(prog);

  const del = document.createElement("button");
  del.className = "icon-btn del";
  del.textContent = "프로젝트 삭제";
  del.addEventListener("click", function () {
    if (!confirm((p.name || "이름 없는 프로젝트") + " 를(을) 삭제합니다.\n안에 있는 작업도 모두 사라집니다. 계속할까요?")) return;
    const idx = projects.findIndex(function (x) { return x.id === p.id; });
    projects = projects.filter(function (x) { return x.id !== p.id; });
    const next = projects[idx] || projects[idx - 1] || projects[0];
    activeId = next ? next.id : null;
    save();
    render();
  });
  head.appendChild(del);

  panel.appendChild(head);

  /* ── 진행률 막대 ── */
  const bar = document.createElement("div");
  bar.className = "p-bar";
  const fill = document.createElement("div");
  fill.className = "p-fill" + (st.total > 0 && st.done === st.total ? " full" : "");
  fill.style.width = st.pct + "%";
  bar.appendChild(fill);
  panel.appendChild(bar);

  /* ── 3칸 ── */
  if (!p.tasks) p.tasks = [];

  const lanes = document.createElement("div");
  lanes.className = "lanes";
  COLUMNS.forEach(function (col, colIdx) { lanes.appendChild(buildLane(p, col, colIdx)); });
  panel.appendChild(lanes);

  /* ── 메모 ── */
  const memo = document.createElement("textarea");
  memo.className = "memo";
  memo.placeholder = "프로젝트 메모 — 요청사항, 수정 내역, 다음에 할 일 등";
  memo.value = p.memo || "";
  memo.addEventListener("input", function () { p.memo = memo.value; save(); });
  panel.appendChild(memo);

  panelHost.appendChild(panel);
}

/* ── 칸 하나 (할 일 / 진행중 / 완료) ─────────────── */
function buildLane(p, col, colIdx) {
  const lane = document.createElement("div");
  lane.className = "lane";

  const rows = p.tasks.filter(function (t) { return (t.column || COLUMNS[0].id) === col.id; });

  const head = document.createElement("div");
  head.className = "lane-head";
  head.innerHTML = '<span class="lane-title tone-' + (col.tone || "neutral") + '"></span>'
    + '<span class="lane-count">' + rows.length + '</span>';
  head.querySelector(".lane-title").textContent = col.label;
  lane.appendChild(head);

  if (!rows.length) {
    const e = document.createElement("div");
    e.className = "lane-empty";
    e.textContent = "비어 있음";
    lane.appendChild(e);
  }

  rows.forEach(function (t) { lane.appendChild(buildTask(p, t, colIdx)); });

  const add = document.createElement("button");
  add.className = "lane-add";
  add.textContent = "+ 작업 추가";
  add.addEventListener("click", function () { addTask(p, col.id); });
  lane.appendChild(add);

  /* 첫 칸에만 기본 세트 */
  if (colIdx === 0) {
    const tpl = document.createElement("button");
    tpl.className = "lane-add";
    tpl.textContent = "+ 기본 세트";
    tpl.title = "자주 쓰는 작업을 한 번에 넣습니다";
    tpl.addEventListener("click", function () {
      TODO_TEMPLATE.forEach(function (text, i) {
        p.tasks.push({ id: "t" + Date.now() + "_" + i, text: text, column: col.id });
      });
      save();
      render();
    });
    lane.appendChild(tpl);
  }

  return lane;
}

/* ── 작업 카드 ─────────────────────────────── */
function buildTask(p, t, colIdx) {
  const el = document.createElement("div");
  el.className = "task" + (t.column === lastColId() ? " is-done" : "");

  const txt = document.createElement("textarea");
  txt.className = "task-text";
  txt.rows = 1;
  txt.placeholder = "작업 내용";
  txt.value = t.text || "";
  txt.dataset.taskId = t.id;

  txt.addEventListener("input", function () {
    t.text = txt.value;
    autoGrow(txt);
    save();
  });

  /* 입력 중인 칸을 기억해 둡니다 */
  txt.addEventListener("focus", function () { focusedTaskId = t.id; });

  txt.addEventListener("blur", function () {
    if (focusedTaskId === t.id) focusedTaskId = null;
    /* 아무것도 안 쓰고 빠져나오면 빈 칸은 지웁니다 */
    if (!txt.value.trim()) {
      p.tasks = p.tasks.filter(function (x) { return x.id !== t.id; });
      save(false);
      render();
    }
  });

  txt.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    /* 한글 조합 중의 Enter 는 글자를 확정하는 키라 건드리지 않습니다 */
    if (e.isComposing || e.keyCode === 229) return;
    if (e.shiftKey) return;              /* Shift+Enter 는 줄바꿈 */
    e.preventDefault();
    t.text = txt.value;
    save();
    txt.blur();                          /* 저장하고 칸에서 빠져나옵니다 */
  });

  el.appendChild(txt);
  requestAnimationFrame(function () { autoGrow(txt); });

  const btns = document.createElement("div");
  btns.className = "task-btns";

  const left = document.createElement("button");
  left.className = "tb";
  left.textContent = "‹";
  left.title = "왼쪽 칸으로";
  left.disabled = colIdx === 0;
  left.addEventListener("click", function () {
    t.column = COLUMNS[colIdx - 1].id;
    save(); render();
  });
  btns.appendChild(left);

  const right = document.createElement("button");
  right.className = "tb";
  right.textContent = "›";
  right.title = "오른쪽 칸으로";
  right.disabled = colIdx === COLUMNS.length - 1;
  right.addEventListener("click", function () {
    t.column = COLUMNS[colIdx + 1].id;
    save(); render();
  });
  btns.appendChild(right);

  const del = document.createElement("button");
  del.className = "tb del";
  del.textContent = "×";
  del.title = "이 작업 삭제";
  del.addEventListener("click", function () {
    p.tasks = p.tasks.filter(function (x) { return x.id !== t.id; });
    save(); render();
  });
  btns.appendChild(del);

  el.appendChild(btns);
  return el;
}

/* ── 추가 ─────────────────────────────── */
function addTask(p, colId) {
  const t = {
    id: "t" + Date.now() + Math.random().toString(36).slice(2, 6),
    text: "",
    column: colId
  };
  p.tasks.push(t);

  /* 방금 만든 칸을 입력 대상으로 지정하면 render 가 알아서 커서를 넣어줍니다 */
  focusedTaskId = t.id;
  save(false);
  render();
}

function addProject() {
  const p = {
    id: "p" + Date.now(),
    name: "", client: "",
    due: "", amount: 0,
    deposit: false, balance: false,
    memo: "",
    tasks: [],
    createdAt: Date.now()
  };
  projects.push(p);          /* 오른쪽 끝에 탭이 붙습니다 */
  activeId = p.id;
  save();
  render();

  /* 새 프로젝트는 이름부터 입력받습니다 */
  const nameBox = panelHost.querySelector(".p-name");
  if (nameBox) nameBox.focus();

  /* 탭이 많으면 새 탭이 보이도록 스크롤 */
  tabrow.scrollLeft = tabrow.scrollWidth;
}

/* ── 요약 ─────────────────────────────── */
function updateSummary() {
  const doneN = projects.filter(isFinished).length;
  const last  = lastColId();

  /* 진행중 = 가운데 칸들, 남은 작업 = 완료 칸이 아닌 모든 작업 */
  const doingN = COLUMNS.slice(1, -1).reduce(function (s, c) { return s + countIn(c.id); }, 0);
  const leftN  = COLUMNS.filter(function (c) { return c.id !== last; })
                        .reduce(function (s, c) { return s + countIn(c.id); }, 0);

  document.getElementById("sumTotal").innerHTML = projects.length + '<span class="sum-unit">개</span>';
  document.getElementById("sumDoing").innerHTML = doingN + '<span class="sum-unit">개</span>';
  document.getElementById("sumLeft").innerHTML  = leftN + '<span class="sum-unit">개</span>';
  document.getElementById("sumDone").innerHTML  = doneN + '<span class="sum-unit">개</span>';
}

render();
loadFromServer();
</script>
