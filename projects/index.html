<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로젝트 보드 · KJC Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- 색상·모서리 값은 theme.css 한 곳에서만 정합니다 -->
<link rel="stylesheet" href="theme.css">

<style>
/* ==========================================================================
   KJC Studio · 프로젝트 보드 — 레이아웃

   구조
     프로젝트 탭 (가로로 쌓임)
       └ 선택된 탭과 이어진 흰 패널
           └ 할 일 / 진행중 / 완료 (회색 칸)
               └ 작업 카드 (흰 블록)

   토스증권 화면 구성을 따릅니다: 회색 바탕 → 흰 패널 → 회색 칸 → 흰 블록
   색·모서리 값은 이 파일에 직접 쓰지 않습니다. 전부 theme.css 의 변수를 씁니다.
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--pj-bg);
  color: var(--pj-text-primary);
  font-family: var(--pj-font-body);
  font-weight: 400;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
}

.wrap { max-width: 1400px; margin: 0 auto; padding: 32px 24px 80px; }

/* ── 상단 ─────────────────────────────── */
.topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.back {
  font-size: 14px; font-weight: 500; color: var(--pj-text-secondary);
  text-decoration: none; padding: 7px 14px; border-radius: var(--pj-radius-pill);
  transition: background 0.15s ease, color 0.15s ease;
}
.back:hover { background: var(--pj-bg-surface); color: var(--pj-text-primary); }

h1 {
  font-size: clamp(24px, 3.5vw, 30px);
  font-weight: 700; letter-spacing: -0.035em; line-height: 1.25;
  margin-bottom: 6px;
}
.subtitle { color: var(--pj-text-secondary); font-size: 14px; }
.head-block { margin-bottom: 22px; padding-left: 2px; }

/* ── 요약 타일 ─────────────────────────────── */
.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.sum-card { background: var(--pj-bg-card); border-radius: var(--pj-radius-lg); padding: 18px 20px; }
.sum-label { font-size: 13px; font-weight: 500; color: var(--pj-text-secondary); margin-bottom: 6px; }
.sum-value {
  font-size: 24px; font-weight: 700; line-height: 1.2;
  letter-spacing: -0.03em; font-variant-numeric: tabular-nums;
}
.sum-value.accent { color: var(--pj-accent); }
.sum-value.warn { color: var(--pj-warn); }
.sum-value.done { color: var(--pj-done); }
.sum-unit { font-size: 14px; font-weight: 600; color: var(--pj-text-dim); margin-left: 3px; }

/* 저장 상태 표시 — 서버까지 갔는지 브라우저에만 있는지 구분해서 보여줍니다 */
.saved {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 600; color: var(--pj-text-muted);
  white-space: nowrap; margin-left: auto; align-self: center;
  padding: 6px 13px; border-radius: var(--pj-radius-pill);
  background: var(--pj-bg-elevated);
  transition: color 0.2s ease, background 0.2s ease, opacity 0.2s ease;
}
.saved::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: currentColor; flex-shrink: 0;
}
.saved.ok   { color: var(--pj-done); background: var(--pj-done-faint); }
.saved.warn { color: var(--pj-warn); background: var(--pj-warn-faint); }
.saved.busy { color: var(--pj-accent); background: var(--pj-accent-faint); }

/* ══════════════════════════════════════════
   프로젝트 탭 — 새로 만들면 오른쪽으로 붙습니다
   ══════════════════════════════════════════ */
.tabrow {
  display: flex; align-items: flex-end; gap: 4px;
  overflow-x: auto; padding-top: 2px;
  scrollbar-width: none;
}
.tabrow::-webkit-scrollbar { display: none; }

.tab {
  display: flex; align-items: center; gap: 7px;
  background: var(--pj-bg-elevated); color: var(--pj-text-secondary);
  border: none; border-radius: var(--pj-radius-md) var(--pj-radius-md) 0 0;
  padding: 11px 17px 12px;
  font-family: inherit; font-size: 14px; font-weight: 600;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
  transition: background 0.15s ease, color 0.15s ease;
}
.tab:hover { background: var(--pj-bg-active); color: var(--pj-text-primary); }

.tab-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pj-text-dim); flex-shrink: 0; }
.tab-cnt { font-size: 12px; font-weight: 600; color: var(--pj-text-dim); font-variant-numeric: tabular-nums; }

/* 선택된 탭 — 아래 패널과 색이 이어져 한 덩어리로 보입니다 */
.tab.on {
  background: var(--pj-bg-card); color: var(--pj-text-primary);
  padding-bottom: 14px; margin-bottom: -2px; z-index: 2; position: relative;
}
.tab.on .tab-dot { background: var(--pj-accent); }
.tab.on .tab-cnt { color: var(--pj-text-muted); }

.tab-add {
  background: transparent; border: none; color: var(--pj-text-muted);
  font-family: inherit; font-size: 14px; font-weight: 600;
  padding: 11px 16px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
  border-radius: var(--pj-radius-md) var(--pj-radius-md) 0 0;
  transition: background 0.15s ease, color 0.15s ease;
}
.tab-add:hover { background: var(--pj-accent-faint); color: var(--pj-accent); }

/* ══ 선택된 프로젝트 패널 ══ */
.panel {
  background: var(--pj-bg-card);
  border-radius: 0 var(--pj-radius-lg) var(--pj-radius-lg) var(--pj-radius-lg);
  padding: 22px 22px 20px;
  position: relative; z-index: 1;
}

.p-head { display: flex; align-items: center; gap: 11px; flex-wrap: wrap; margin-bottom: 14px; }

.p-name {
  flex: 1; min-width: 200px;
  font-family: inherit; font-size: 21px; font-weight: 700;
  letter-spacing: -0.03em; color: var(--pj-text-primary);
  background: transparent; border: none;
  border-radius: var(--pj-radius-sm); padding: 5px 9px; margin-left: -9px;
  transition: background 0.15s ease;
}
.p-name:hover { background: var(--pj-bg-elevated); }
.p-name:focus { outline: none; background: var(--pj-bg-elevated); box-shadow: inset 0 0 0 2px var(--pj-accent); }
.p-name::placeholder { color: var(--pj-text-dim); font-weight: 700; }

.p-prog { font-size: 13px; font-weight: 600; color: var(--pj-text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

.icon-btn {
  font-family: inherit; font-size: 13px; font-weight: 600; line-height: 1;
  color: var(--pj-text-muted); background: var(--pj-bg-elevated);
  border: none; border-radius: var(--pj-radius-pill);
  padding: 9px 15px; cursor: pointer; white-space: nowrap;
  transition: background 0.15s ease, color 0.15s ease;
}
.icon-btn:hover { background: var(--pj-bg-active); color: var(--pj-text-primary); }
.icon-btn.del:hover { background: var(--pj-danger-faint); color: var(--pj-danger); }

/* 진행률 막대 */
.p-bar { height: 6px; background: var(--pj-bg-elevated); border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
.p-fill { height: 100%; width: 0; background: var(--pj-accent); border-radius: 99px; transition: width 0.3s ease; }
.p-fill.full { background: var(--pj-done); }

/* ── 3칸 ─────────────────────────────── */
.lanes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

.lane {
  background: var(--pj-bg);
  border-radius: var(--pj-radius-md);
  padding: 12px 11px 11px;
  min-height: 130px;
}
.lane-head { display: flex; align-items: center; gap: 7px; margin-bottom: 10px; }
.lane-title {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 600; letter-spacing: -0.02em;
  padding: 5px 12px; border-radius: var(--pj-radius-pill);
  background: var(--pj-bg-elevated); color: var(--pj-text-strong);
}
.lane-title.tone-accent { background: var(--pj-accent-faint); color: var(--pj-accent); }
.lane-title.tone-done   { background: var(--pj-done-faint);   color: var(--pj-done); }
.lane-title::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: currentColor; flex-shrink: 0;
}
.lane-count { font-size: 12px; font-weight: 600; color: var(--pj-text-dim); font-variant-numeric: tabular-nums; }

.lane-add {
  font-family: inherit; font-size: 13px; font-weight: 600;
  color: var(--pj-text-muted); background: transparent;
  border: none; border-radius: var(--pj-radius-pill);
  width: 100%; padding: 9px 13px; cursor: pointer; text-align: left;
  transition: background 0.15s ease, color 0.15s ease;
}
.lane-add:hover { background: var(--pj-accent-faint); color: var(--pj-accent); }

.lane-empty { text-align: center; color: var(--pj-text-dim); font-size: 12px; font-weight: 500; padding: 12px 0 14px; }

/* ── 작업 카드 ─────────────────────────────── */
.task {
  background: var(--pj-bg-card);
  border-radius: var(--pj-radius-sm);
  padding: 10px 11px 8px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: box-shadow 0.15s ease, transform 0.15s ease;
}
.task:hover { box-shadow: 0 0 0 2px var(--pj-accent); transform: translateY(-1px); }

.task-line { display: flex; align-items: flex-start; gap: 7px; }
.task-text {
  flex: 1; font-size: 13px; font-weight: 500;
  line-height: 1.5; color: var(--pj-text-primary); word-break: break-word;
}
.task.is-done .task-text { color: var(--pj-text-dim); text-decoration: line-through; }
.task-empty { color: var(--pj-text-dim); font-weight: 400; }

/* 우선순위 높음만 점으로 표시 */
.task-flag {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--pj-danger); flex-shrink: 0; margin-top: 5px;
}

/* 카드 안 체크리스트 — 창을 열지 않고 바로 체크합니다 */
.card-subs { margin-top: 8px; }
.card-sub {
  display: flex; align-items: flex-start; gap: 7px;
  padding: 3px 4px; border-radius: 6px;
  transition: background 0.13s ease;
}
.card-sub:hover { background: var(--pj-bg-elevated); }

.card-sub-box {
  width: 15px; height: 15px; border: 2px solid var(--pj-border-strong);
  border-radius: 5px; flex-shrink: 0; margin-top: 2px;
  position: relative; cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.card-sub-box:hover { border-color: var(--pj-accent); }
.card-sub-box::after {
  content: ""; position: absolute; left: 3px; top: 0;
  width: 4px; height: 8px;
  border-right: 2px solid var(--pj-text-on-fill); border-bottom: 2px solid var(--pj-text-on-fill);
  transform: rotate(45deg) scale(0); transition: transform 0.16s cubic-bezier(0.34,1.56,0.64,1);
}
.card-sub.on .card-sub-box { background: var(--pj-accent); border-color: var(--pj-accent); }
.card-sub.on .card-sub-box::after { transform: rotate(45deg) scale(1); }

.card-sub-text {
  flex: 1; font-size: 12px; font-weight: 500; line-height: 1.45;
  color: var(--pj-text-secondary); word-break: break-word;
}
.card-sub.on .card-sub-text { color: var(--pj-text-dim); text-decoration: line-through; }

/* 카드 겉면 요약 — 창을 열지 않아도 보이게 */
.task-mini { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 7px; }
.mini-chip {
  font-size: 11px; font-weight: 600; padding: 2px 8px;
  border-radius: var(--pj-radius-pill);
  background: var(--pj-bg-elevated); color: var(--pj-text-secondary);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.mini-chip.full { background: var(--pj-done-faint); color: var(--pj-done); }
.mini-chip.soon { background: var(--pj-warn-faint); color: var(--pj-warn); }
.mini-chip.over { background: var(--pj-danger-faint); color: var(--pj-danger); }
.mini-chip.ok   { background: var(--pj-accent-faint); color: var(--pj-accent); }

.task-btns { display: flex; gap: 2px; flex-shrink: 0; }
.tb {
  font-family: inherit; font-size: 12px; font-weight: 600; line-height: 1;
  color: var(--pj-text-dim); background: transparent;
  border: none; border-radius: var(--pj-radius-pill); padding: 4px 8px; cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}
.tb:hover:not(:disabled) { background: var(--pj-accent-faint); color: var(--pj-accent); }
.tb.del:hover { background: var(--pj-danger-faint); color: var(--pj-danger); }
.tb:disabled { opacity: 0.25; cursor: default; }

/* 메모 */
.memo {
  display: block; width: 100%; min-height: 48px; resize: vertical;
  margin-top: 12px;
  font-family: inherit; font-size: 13px; font-weight: 500; line-height: 1.6;
  color: var(--pj-text-primary); background: var(--pj-bg-elevated);
  border: none; border-radius: var(--pj-radius-md); padding: 11px 13px;
  transition: box-shadow 0.15s ease;
}
.memo::placeholder { color: var(--pj-text-dim); font-weight: 400; }
.memo:focus { outline: none; box-shadow: inset 0 0 0 2px var(--pj-accent); }

/* ══════════════════════════════════════════
   작업 상세창 — 카드를 누르면 가운데에 뜹니다
   ══════════════════════════════════════════ */
.tm-overlay {
  position: fixed; inset: 0; background: var(--pj-scrim);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 20px; overflow-y: auto; z-index: 90;
}
.tm-overlay[hidden] { display: none !important; }

.tm {
  background: var(--pj-bg-card);
  border-radius: var(--pj-radius-xl);
  box-shadow: var(--pj-shadow-lg);
  width: 100%; max-width: 460px;
  padding: 22px 22px 18px;
}

.tm-top { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.tm-lane {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600;
  padding: 5px 12px; border-radius: var(--pj-radius-pill);
  background: var(--pj-bg-elevated); color: var(--pj-text-strong);
}
.tm-lane.tone-accent { background: var(--pj-accent-faint); color: var(--pj-accent); }
.tm-lane.tone-done   { background: var(--pj-done-faint);   color: var(--pj-done); }
.tm-lane::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: currentColor; flex-shrink: 0;
}
.tm-path { font-size: 12px; font-weight: 500; color: var(--pj-text-dim); }
.tm-x {
  margin-left: auto; font-family: inherit; font-size: 17px; line-height: 1;
  color: var(--pj-text-dim); background: transparent; border: none;
  border-radius: var(--pj-radius-pill); padding: 5px 9px; cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}
.tm-x:hover { background: var(--pj-bg-elevated); color: var(--pj-text-primary); }

.tm-title {
  display: block; width: 100%; resize: none; overflow: hidden;
  font-family: inherit; font-size: 19px; font-weight: 700; line-height: 1.4;
  letter-spacing: -0.03em; color: var(--pj-text-primary);
  background: var(--pj-bg-elevated); border: none;
  border-radius: var(--pj-radius-md); padding: 11px 13px; margin-bottom: 16px;
  transition: box-shadow 0.15s ease;
}
.tm-title:focus { outline: none; box-shadow: inset 0 0 0 2px var(--pj-accent); }
.tm-title::placeholder { color: var(--pj-text-dim); font-weight: 700; }

.tm-row { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; flex-wrap: wrap; }
.tm-lbl { font-size: 13px; font-weight: 500; color: var(--pj-text-secondary); width: 60px; flex-shrink: 0; }

.tm-seg { display: flex; gap: 3px; background: var(--pj-bg-elevated); border-radius: var(--pj-radius-md); padding: 3px; }
.tm-seg button {
  font-family: inherit; font-size: 12px; font-weight: 600;
  color: var(--pj-text-secondary); background: transparent;
  border: none; border-radius: var(--pj-radius-sm);
  padding: 7px 13px; cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}
.tm-seg button:hover { color: var(--pj-text-primary); }
.tm-seg button.on { background: var(--pj-bg-card); color: var(--pj-accent); }
.tm-seg button.on.hot { color: var(--pj-danger); }

.tm-sec { display: flex; align-items: center; gap: 9px; margin: 20px 0 8px; }
.tm-sec b { font-size: 14px; font-weight: 600; }
.tm-bar { flex: 1; height: 6px; background: var(--pj-bg-elevated); border-radius: 99px; overflow: hidden; }
.tm-fill { height: 100%; width: 0; background: var(--pj-accent); border-radius: 99px; transition: width 0.3s ease; }
.tm-fill.full { background: var(--pj-done); }
.tm-pct { font-size: 12px; font-weight: 600; color: var(--pj-text-muted); font-variant-numeric: tabular-nums; }

/* 세부 항목 */
.sub {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 8px; border-radius: var(--pj-radius-sm);
  transition: background 0.13s ease;
}
.sub:hover { background: var(--pj-bg-elevated); }
.sub-box {
  width: 18px; height: 18px; border: 2px solid var(--pj-border-strong);
  border-radius: 6px; flex-shrink: 0; position: relative; cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.sub-box:hover { border-color: var(--pj-accent); }
.sub-box::after {
  content: ""; position: absolute; left: 4px; top: 0;
  width: 5px; height: 10px;
  border-right: 2px solid var(--pj-text-on-fill); border-bottom: 2px solid var(--pj-text-on-fill);
  transform: rotate(45deg) scale(0); transition: transform 0.16s cubic-bezier(0.34,1.56,0.64,1);
}
.sub.on .sub-box { background: var(--pj-accent); border-color: var(--pj-accent); }
.sub.on .sub-box::after { transform: rotate(45deg) scale(1); }

.sub-text {
  flex: 1; font-family: inherit; font-size: 13px; font-weight: 500;
  color: var(--pj-text-primary); background: transparent;
  border: none; border-radius: 6px; padding: 3px 5px;
}
.sub-text:focus { outline: none; box-shadow: inset 0 0 0 2px var(--pj-accent); background: var(--pj-bg-card); }
.sub.on .sub-text { color: var(--pj-text-dim); text-decoration: line-through; }

.sub-del {
  font-family: inherit; font-size: 15px; line-height: 1; color: var(--pj-text-dim);
  background: transparent; border: none; cursor: pointer; padding: 3px 7px;
  border-radius: var(--pj-radius-pill); opacity: 0;
  transition: opacity 0.15s ease, color 0.15s ease, background 0.15s ease;
}
.sub:hover .sub-del { opacity: 1; }
.sub-del:hover { color: var(--pj-danger); background: var(--pj-danger-faint); }

.tm-add {
  font-family: inherit; font-size: 13px; font-weight: 600;
  color: var(--pj-text-muted); background: transparent;
  border: none; border-radius: var(--pj-radius-pill);
  width: 100%; padding: 8px 10px; cursor: pointer; text-align: left;
  transition: background 0.15s ease, color 0.15s ease;
}
.tm-add:hover { background: var(--pj-accent-faint); color: var(--pj-accent); }

.tm-in {
  font-family: inherit; font-size: 13px; font-weight: 500;
  color: var(--pj-text-primary); background: var(--pj-bg-elevated);
  border: none; border-radius: var(--pj-radius-sm);
  padding: 9px 11px; width: 100%;
  transition: box-shadow 0.15s ease;
}
.tm-in:focus { outline: none; box-shadow: inset 0 0 0 2px var(--pj-accent); }
.tm-in::placeholder { color: var(--pj-text-dim); font-weight: 400; }

/* 참고 링크 */
.lnk { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--pj-radius-sm); }
.lnk:hover { background: var(--pj-bg-elevated); }
.lnk a {
  flex: 1; font-size: 13px; font-weight: 500; color: var(--pj-accent);
  text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.lnk a:hover { text-decoration: underline; }

.tm-memo {
  display: block; width: 100%; min-height: 60px; resize: vertical;
  font-family: inherit; font-size: 13px; font-weight: 500; line-height: 1.6;
  color: var(--pj-text-primary); background: var(--pj-bg-elevated);
  border: none; border-radius: var(--pj-radius-md); padding: 10px 12px;
  transition: box-shadow 0.15s ease;
}
.tm-memo::placeholder { color: var(--pj-text-dim); font-weight: 400; }
.tm-memo:focus { outline: none; box-shadow: inset 0 0 0 2px var(--pj-accent); }

.tm-stamp {
  font-size: 11.5px; color: var(--pj-text-dim);
  margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--pj-bg-elevated);
}
.tm-foot { display: flex; gap: 7px; justify-content: flex-end; margin-top: 12px; }

/* ══════════════════════════════════════════
   확인창 — 추가·삭제 모두 같은 모양을 씁니다
   ══════════════════════════════════════════ */
.dlg-overlay {
  position: fixed; inset: 0; background: var(--pj-scrim);
  display: flex; align-items: center; justify-content: center;
  padding: 24px; z-index: 100;
}
.dlg-overlay[hidden] { display: none !important; }

.dlg {
  background: var(--pj-bg-card);
  border-radius: var(--pj-radius-xl);
  box-shadow: var(--pj-shadow-lg);
  width: 100%; max-width: 400px;
  padding: 26px 26px 20px;
}
.dlg-title { font-size: 18px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 8px; }
.dlg-desc { font-size: 14px; color: var(--pj-text-secondary); line-height: 1.6; margin-bottom: 16px; }
.dlg-desc:empty { display: none; }

.dlg-input {
  display: block; width: 100%;
  font-family: inherit; font-size: 16px; font-weight: 500;
  color: var(--pj-text-primary); background: var(--pj-bg-elevated);
  border: none; border-radius: var(--pj-radius-md);
  padding: 13px 15px; margin-bottom: 16px;
  transition: box-shadow 0.15s ease;
}
.dlg-input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--pj-accent); }
.dlg-input::placeholder { color: var(--pj-text-dim); font-weight: 400; }
.dlg-input[hidden] { display: none !important; }

.dlg-ask { font-size: 14px; font-weight: 600; margin-bottom: 20px; }

/* 버튼 기본 — 보드 안의 다른 버튼들과 같은 모양(완전히 둥근 형태)을 씁니다 */
.btn {
  font-family: inherit; font-size: 14px; font-weight: 600;
  color: var(--pj-text-strong); background: var(--pj-bg-elevated);
  border: none; border-radius: var(--pj-radius-pill);
  padding: 10px 18px; cursor: pointer; white-space: nowrap;
  transition: background 0.15s ease, color 0.15s ease, filter 0.15s ease;
}
.btn:hover { background: var(--pj-bg-active); }
.btn.primary { color: var(--pj-text-on-fill); background: var(--pj-accent); }
.btn.primary:hover { background: var(--pj-accent-hover); }

.dlg-foot { display: flex; gap: 8px; justify-content: flex-end; }
.dlg-foot .btn { padding: 11px 22px; font-size: 14px; }
.dlg-foot .btn.ghost { background: var(--pj-bg-elevated); color: var(--pj-text-secondary); }
.dlg-foot .btn.ghost:hover { background: var(--pj-bg-active); color: var(--pj-text-primary); }
.dlg-foot .btn.wreck { background: var(--pj-danger); color: var(--pj-text-on-fill); }
.dlg-foot .btn.wreck:hover { background: var(--pj-danger); filter: brightness(0.92); }

/* 빈 상태 */
.empty {
  background: var(--pj-bg-card); border-radius: var(--pj-radius-lg);
  text-align: center; padding: 70px 20px;
}
.empty-title { font-size: 17px; font-weight: 700; margin-bottom: 7px; }
.empty-desc { font-size: 14px; color: var(--pj-text-secondary); }

@media print {
  .lane-add, .task-btns, .back, .icon-btn, .tab-add { display: none; }
  .wrap { padding: 0; max-width: none; }
  .panel, .lane, .task { break-inside: avoid; }
}

@media (max-width: 900px) {
  .summary { grid-template-columns: repeat(2, 1fr); }
  .lanes { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .wrap { padding: 24px 14px 70px; }
  .panel { padding: 18px 15px 16px; }
}
</style>

<body>

<div class="wrap">
  <div class="topbar">
    <a class="back" href="../index.html">← KJC Studio</a>
    <span class="saved" id="savedTag">불러오는 중…</span>
  </div>

  <div class="head-block">

    <p class="subtitle">프로젝트마다 할 일 · 진행중 · 완료를 따로 관리합니다</p>
  </div>

  <div class="summary">
    <div class="sum-card">
      <div class="sum-label">전체 프로젝트</div>
      <div class="sum-value accent" id="sumTotal">0<span class="sum-unit">개</span></div>
    </div>
    <div class="sum-card">
      <div class="sum-label">진행중 작업</div>
      <div class="sum-value warn" id="sumDoing">0<span class="sum-unit">개</span></div>
    </div>
    <div class="sum-card">
      <div class="sum-label">남은 작업</div>
      <div class="sum-value" id="sumLeft">0<span class="sum-unit">개</span></div>
    </div>
    <div class="sum-card">
      <div class="sum-label">완료된 프로젝트</div>

</div>

<!-- 작업 상세창 -->
<div class="tm-overlay" id="tmOverlay" hidden>
  <div class="tm" id="tm"></div>
</div>

<!-- 확인창 (추가·삭제 공용) -->
<div class="dlg-overlay" id="dlgOverlay" hidden>
  <div class="dlg">
    <div class="dlg-title" id="dlgTitle"></div>
    <div class="dlg-desc" id="dlgDesc"></div>
    <input class="dlg-input" id="dlgInput" hidden>
    <div class="dlg-ask" id="dlgAsk"></div>
    <div class="dlg-foot">
      <button class="btn ghost" id="dlgCancel">취소</button>
      <button class="btn primary" id="dlgOk">확인</button>
    </div>
  </div>
</div>

<script src="data/config.js"></script>
<script>
/* ==========================================================================
   데이터 구조
     프로젝트 { id, name, client, due, amount, deposit, balance, memo, tasks[] }
     작업     { id, text, column }
   localStorage 에 저장합니다.
   ========================================================================== */
const STORE_KEY  = "kjc-projects-v2";
const OLD_KEY    = "kjc-projects-v1";
const ACTIVE_KEY = "kjc-projects-active-v2";

let projects = [];
let activeId = null;

/* ── 불러오기 (예전 구조는 자동 변환) ─────────────────────────────── */
function load() {
  try {
    const cur = JSON.parse(localStorage.getItem(STORE_KEY));
    if (Array.isArray(cur)) return cur;
  } catch (e) { /* 아래에서 예전 데이터 확인 */ }

  /* 예전 구조: 카드 하나 = 클라이언트 작업, 그 안에 todos[] 가 있었습니다.
     카드를 프로젝트로 올리고 todos 를 작업 카드로 내립니다. */
  try {
    const old = JSON.parse(localStorage.getItem(OLD_KEY));
    if (Array.isArray(old) && old.length) {
      return old.map(function (o) {
        return {
          id: o.id || ("p" + Date.now() + Math.random().toString(36).slice(2, 6)),
          name: o.title || "",
          client: o.client || "",
          due: o.due || "",
          amount: o.amount || 0,
          deposit: !!o.deposit,
          balance: !!o.balance,
          memo: o.memo || "",
          createdAt: o.createdAt || Date.now(),
          tasks: (o.todos || []).map(function (t, i) {
            return {
              id: t.id || ("t" + Date.now() + "_" + i),
              text: t.text || "",
              column: t.done ? "done" : (o.column === "doing" ? "doing" : "todo")
            };
          })
        };
      });
    }
  } catch (e) { /* 변환 실패 시 빈 목록 */ }

  return [];
}

projects = load();
try { activeId = localStorage.getItem(ACTIVE_KEY) || null; } catch (e) { activeId = null; }
if (!byId(activeId) && projects.length) activeId = projects[0].id;

/* ══════════════════════════════════════════
   저장
     1. 브라우저에 즉시 저장 (전기가 나가도 안 잃게)
     2. 서버에는 1초 모아서 한 번 보냄 (타이핑마다 부르지 않으려고)
     서버가 없거나 실패해도 화면은 그대로 동작합니다.
   ══════════════════════════════════════════ */
const API = "/api/board";
const SYNC_DELAY = 1000;

const savedTag = document.getElementById("savedTag");
let syncTimer = null;
let syncing = false;
let pending = false;      /* 저장 중에 또 바뀌었는지 */
let serverAlive = null;   /* null 아직 모름 · true 서버 저장됨 · false 브라우저만 */

function setStatus(text, cls) {
  savedTag.textContent = text;
  savedTag.className = "saved" + (cls ? " " + cls : "");
}

function persistLocal() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(projects));
    if (activeId) localStorage.setItem(ACTIVE_KEY, activeId);
  } catch (e) { /* 저장이 막힌 환경이어도 화면은 동작합니다 */ }
}

function save(flash) {
  persistLocal();
  scheduleSync();
  if (flash !== false && serverAlive !== false) setStatus("저장 중…", "busy");
}

function scheduleSync() {
  if (syncing) { pending = true; return; }
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncToServer, SYNC_DELAY);
}

function syncToServer() {
  syncing = true;
  pending = false;

  fetch(API, {
    method: "PUT",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ data: { projects: projects, activeId: activeId } })
  })
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function () {
      serverAlive = true;
      setStatus("서버에 저장됨", "ok");
    })
    .catch(function () {
      serverAlive = false;
      setStatus("이 브라우저에만 저장됨", "warn");
    })
    .then(function () {
      syncing = false;
      if (pending) scheduleSync();
    });
}

/* 서버에서 불러오기 — 실패하면 브라우저에 있던 내용으로 갑니다 */
function loadFromServer() {
  return fetch(API, { headers: { accept: "application/json" } })
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function (body) {
      serverAlive = true;

      if (body && body.ok && body.data && Array.isArray(body.data.projects)) {
        projects = body.data.projects;
        if (body.data.activeId) activeId = body.data.activeId;
        if (!byId(activeId) && projects.length) activeId = projects[0].id;
        persistLocal();
        setStatus("서버에서 불러옴", "ok");
        render();
        return;
      }

      /* 서버에 아직 아무것도 없으면, 이 브라우저에 있던 내용을 올려 둡니다 */
      setStatus("서버 연결됨", "ok");
      if (projects.length) scheduleSync();
    })
    .catch(function () {
      serverAlive = false;
      setStatus("이 브라우저에만 저장됨", "warn");
    });
}

/* ══════════════════════════════════════════
   확인창 — 추가와 삭제가 같은 규칙을 씁니다
     · 이름을 받아야 할 때는 입력칸이 함께 나옵니다
     · Enter 또는 확인 버튼으로 진행, Esc 또는 취소로 중단
     · 한글 조합을 확정하는 Enter 는 진행으로 치지 않습니다
   ══════════════════════════════════════════ */
const dlg = {
  overlay: document.getElementById("dlgOverlay"),
  title:   document.getElementById("dlgTitle"),
  desc:    document.getElementById("dlgDesc"),
  input:   document.getElementById("dlgInput"),
  ask:     document.getElementById("dlgAsk"),
  ok:      document.getElementById("dlgOk"),
  cancel:  document.getElementById("dlgCancel"),
};
let dlgResolve = null;

/* 이름을 받는 경우 입력한 글자를, 확인만 하는 경우 true 를 돌려줍니다.
   취소하면 null 입니다. */
function ask(opts) {
  return new Promise(function (resolve) {
    dlgResolve = resolve;

    dlg.title.textContent = opts.title || "";
    dlg.desc.textContent  = opts.desc || "";
    dlg.ask.textContent   = opts.ask || "";
    dlg.ok.textContent    = opts.okText || "확인";
    dlg.ok.className      = "btn " + (opts.danger ? "wreck" : "primary");

    if (opts.input) {
      dlg.input.hidden = false;
      dlg.input.placeholder = opts.placeholder || "";
      dlg.input.value = opts.value || "";
    } else {
      dlg.input.hidden = true;
      dlg.input.value = "";
    }

    dlg.overlay.hidden = false;

    /* 입력칸이 있으면 거기에, 없으면 확인 버튼에 커서를 둡니다.
       그래야 바로 Enter 를 눌러 진행할 수 있습니다. */
    setTimeout(function () {
      if (opts.input) { dlg.input.focus(); dlg.input.select(); }
      else dlg.ok.focus();
    }, 0);
  });
}

function closeDlg(result) {
  dlg.overlay.hidden = true;
  const done = dlgResolve;
  dlgResolve = null;
  if (done) done(result);
}

dlg.ok.addEventListener("click", function () {
  const needsName = !dlg.input.hidden;
  const value = dlg.input.value.trim();
  if (needsName && !value) { dlg.input.focus(); return; }   /* 이름 없이는 진행 안 함 */
  closeDlg(needsName ? value : true);
});

dlg.cancel.addEventListener("click", function () { closeDlg(null); });
dlg.overlay.addEventListener("click", function (e) {
  if (e.target === dlg.overlay) closeDlg(null);
});

dlg.input.addEventListener("keydown", function (e) {
  if (e.key !== "Enter") return;
  if (e.isComposing || e.keyCode === 229) return;   /* 한글 조합 확정 */
  e.preventDefault();
  dlg.ok.click();
});

document.addEventListener("keydown", function (e) {
  if (dlg.overlay.hidden) return;
  if (e.key === "Escape") { e.preventDefault(); closeDlg(null); return; }
  if (e.key === "Enter" && document.activeElement !== dlg.input) {
    if (e.isComposing || e.keyCode === 229) return;
    e.preventDefault();
    dlg.ok.click();
  }
});

/* ── 보조 함수 ─────────────────────────────── */
function byId(id) {
  if (!id) return null;
  for (var i = 0; i < projects.length; i++) if (projects[i].id === id) return projects[i];
  return null;
}

function lastColId() { return COLUMNS[COLUMNS.length - 1].id; }

/* ── 마감일 ─────────────────────────────── */
function daysLeft(dateStr) {
  if (!dateStr) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const due = new Date(dateStr + "T00:00:00");
  if (isNaN(due)) return null;
  return Math.round((due - today) / 86400000);
}

function ddayInfo(d) {
  if (d === null) return null;
  if (d < 0)   return { text: "D+" + Math.abs(d), cls: "over" };
  if (d === 0) return { text: "D-DAY", cls: "over" };
  if (d <= DUE_SOON_DAYS) return { text: "D-" + d, cls: "soon" };
  return { text: "D-" + d, cls: "ok" };
}

/* 어느 칸에 든 작업이 몇 개인지 (전체 프로젝트 합계) */
function countIn(colId) {
  return projects.reduce(function (s, p) {
    return s + (p.tasks || []).filter(function (t) { return (t.column || COLUMNS[0].id) === colId; }).length;
  }, 0);
}

function progOf(p) {
  const list = p.tasks || [];
  const done = list.filter(function (t) { return t.column === lastColId(); }).length;
  return { done: done, total: list.length, pct: list.length ? Math.round(done / list.length * 100) : 0 };
}

function isFinished(p) {
  const st = progOf(p);
  return st.total > 0 && st.done === st.total;
}

function autoGrow(el) {
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}

/* ── 화면 그리기 ─────────────────────────────── */
const tabrow = document.getElementById("tabrow");
const panelHost = document.getElementById("panelHost");

function render() {
  drawTabs();
  drawPanel();
  updateSummary();
}

/* ── 탭 줄 ─────────────────────────────── */
function drawTabs() {
  tabrow.innerHTML = "";

  projects.forEach(function (p) {
    const st = progOf(p);

    const tab = document.createElement("button");
    tab.className = "tab" + (p.id === activeId ? " on" : "");

    const dot = document.createElement("span");
    dot.className = "tab-dot";
    tab.appendChild(dot);

    const nm = document.createElement("span");
    nm.textContent = p.name || "이름 없음";
    tab.appendChild(nm);

    if (st.total) {
      const cnt = document.createElement("span");
      cnt.className = "tab-cnt";
      cnt.textContent = st.done + "/" + st.total;
      tab.appendChild(cnt);
    }

    tab.addEventListener("click", function () {
      activeId = p.id;
      save(false);
      render();
    });

    tabrow.appendChild(tab);
  });

  const add = document.createElement("button");
  add.className = "tab-add";
  add.textContent = "+ 새 프로젝트";
  add.addEventListener("click", addProject);
  tabrow.appendChild(add);
}

/* ── 선택된 프로젝트 패널 ─────────────────────────────── */
function drawPanel() {
  panelHost.innerHTML = "";

  const p = byId(activeId);
  if (!p) {
    const e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = '<div class="empty-title">아직 프로젝트가 없습니다</div>'
      + '<div class="empty-desc">위의 <strong>+ 새 프로젝트</strong> 를 눌러 시작하세요.</div>';
    panelHost.appendChild(e);
    return;
  }

  const panel = document.createElement("div");
  panel.className = "panel";

  /* ── 제목 줄 ── */
  const head = document.createElement("div");
  head.className = "p-head";

  const name = document.createElement("input");
  name.className = "p-name";
  name.placeholder = "프로젝트 이름을 입력하세요";
  name.value = p.name || "";
  name.addEventListener("input", function () {
    p.name = name.value;
    save();
    drawTabs();          /* 탭 이름도 같이 바뀝니다 */
  });
  head.appendChild(name);

  const st = progOf(p);
  const prog = document.createElement("span");
  prog.className = "p-prog";
  prog.textContent = st.total ? st.done + "/" + st.total + " · " + st.pct + "%" : "작업 없음";
  head.appendChild(prog);

  const del = document.createElement("button");
  del.className = "icon-btn del";
  del.textContent = "프로젝트 삭제";
  del.addEventListener("click", function () {
    ask({
      title: "프로젝트 삭제",
      desc: "\"" + (p.name || "이름 없는 프로젝트") + "\" 안에 있는 작업까지 모두 사라집니다. 되돌릴 수 없습니다.",
      ask: "정말로 삭제하시겠습니까?",
      okText: "삭제",
      danger: true
    }).then(function (ok) {
      if (!ok) return;
      const idx = projects.findIndex(function (x) { return x.id === p.id; });
      projects = projects.filter(function (x) { return x.id !== p.id; });
      const next = projects[idx] || projects[idx - 1] || projects[0];
      activeId = next ? next.id : null;
      save();
      render();
    });
  });
  head.appendChild(del);

  panel.appendChild(head);

  /* ── 진행률 막대 ── */
  const bar = document.createElement("div");
  bar.className = "p-bar";
  const fill = document.createElement("div");
  fill.className = "p-fill" + (st.total > 0 && st.done === st.total ? " full" : "");
  fill.style.width = st.pct + "%";
  bar.appendChild(fill);
  panel.appendChild(bar);

  /* ── 3칸 ── */
  if (!p.tasks) p.tasks = [];

  const lanes = document.createElement("div");
  lanes.className = "lanes";
  COLUMNS.forEach(function (col, colIdx) { lanes.appendChild(buildLane(p, col, colIdx)); });
  panel.appendChild(lanes);

  /* ── 메모 ── */
  const memo = document.createElement("textarea");
  memo.className = "memo";
  memo.placeholder = "프로젝트 메모 — 요청사항, 수정 내역, 다음에 할 일 등";
  memo.value = p.memo || "";
  memo.addEventListener("input", function () { p.memo = memo.value; save(); });
  panel.appendChild(memo);

  panelHost.appendChild(panel);
}

/* ── 칸 하나 (할 일 / 진행중 / 완료) ─────────────── */
function buildLane(p, col, colIdx) {
  const lane = document.createElement("div");
  lane.className = "lane";

  const rows = p.tasks.filter(function (t) { return (t.column || COLUMNS[0].id) === col.id; });

  const head = document.createElement("div");
  head.className = "lane-head";
  head.innerHTML = '<span class="lane-title tone-' + (col.tone || "neutral") + '"></span>'
    + '<span class="lane-count">' + rows.length + '</span>';
  head.querySelector(".lane-title").textContent = col.label;
  lane.appendChild(head);

  if (!rows.length) {
    const e = document.createElement("div");
    e.className = "lane-empty";
    e.textContent = "비어 있음";
    lane.appendChild(e);
  }

  rows.forEach(function (t) { lane.appendChild(buildTask(p, t, colIdx)); });

  const add = document.createElement("button");
  add.className = "lane-add";
  add.textContent = "+ 작업 추가";
  add.addEventListener("click", function () { addTask(p, col.id); });
  lane.appendChild(add);

  /* 첫 칸에만 기본 세트 */
  if (colIdx === 0) {
    const tpl = document.createElement("button");
    tpl.className = "lane-add";
    tpl.textContent = "+ 기본 세트";
    tpl.title = "자주 쓰는 작업을 한 번에 넣습니다";
    tpl.addEventListener("click", function () { addTemplate(p, col.id); });
    lane.appendChild(tpl);
  }

  return lane;
}

/* ── 작업 카드 ─────────────────────────────── */
/* 예전에 만든 작업에는 없던 칸을 채워 둡니다 (그대로 두면 undefined 가 됩니다) */
function fillTask(t) {
  if (!t.subs)  t.subs = [];
  if (!t.links) t.links = [];
  if (typeof t.due !== "string")      t.due = "";
  if (typeof t.memo !== "string")     t.memo = "";
  if (!t.priority)                    t.priority = "normal";
  if (!t.createdAt)                   t.createdAt = Date.now();
  return t;
}

function subStat(t) {
  const list = t.subs || [];
  const done = list.filter(function (s) { return s.done; }).length;
  return { done: done, total: list.length, pct: list.length ? Math.round(done / list.length * 100) : 0 };
}

function touch(t) { t.updatedAt = Date.now(); }

function stampText(t) {
  function fmt(ms) {
    if (!ms) return "—";
    const d = new Date(ms);
    return (d.getMonth() + 1) + "월 " + d.getDate() + "일";
  }
  return "만든 날 " + fmt(t.createdAt) + " · 마지막 수정 " + fmt(t.updatedAt || t.createdAt);
}

function buildTask(p, t, colIdx) {
  fillTask(t);

  const el = document.createElement("div");
  el.className = "task" + (t.column === lastColId() ? " is-done" : "");
  el.title = "눌러서 자세히 보기";

  /* 윗줄 — 우선순위 점 + 내용 + 이동 버튼 */
  const line = document.createElement("div");
  line.className = "task-line";

  if (t.priority === "high") {
    const flag = document.createElement("span");
    flag.className = "task-flag";
    flag.title = "우선순위 높음";
    line.appendChild(flag);
  }

  const txt = document.createElement("div");
  txt.className = "task-text" + (t.text ? "" : " task-empty");
  txt.textContent = t.text || "내용 없음";
  line.appendChild(txt);

  const btns = document.createElement("div");
  btns.className = "task-btns";

  const left = document.createElement("button");
  left.className = "tb";
  left.textContent = "‹";
  left.title = "왼쪽 칸으로";
  left.disabled = colIdx === 0;
  left.addEventListener("click", function (e) {
    e.stopPropagation();                 /* 카드 열기와 겹치지 않게 */
    t.column = COLUMNS[colIdx - 1].id;
    touch(t); save(); render();
  });
  btns.appendChild(left);

  const right = document.createElement("button");
  right.className = "tb";
  right.textContent = "›";
  right.title = "오른쪽 칸으로";
  right.disabled = colIdx === COLUMNS.length - 1;
  right.addEventListener("click", function (e) {
    e.stopPropagation();
    t.column = COLUMNS[colIdx + 1].id;
    touch(t); save(); render();
  });
  btns.appendChild(right);

  line.appendChild(btns);
  el.appendChild(line);

  /* 세부 항목 — 카드에 펼쳐서 보여주고, 여기서 바로 체크합니다 */
  if ((t.subs || []).length) {
    const box = document.createElement("div");
    box.className = "card-subs";

    t.subs.forEach(function (s) {
      const row = document.createElement("div");
      row.className = "card-sub" + (s.done ? " on" : "");

      const chk = document.createElement("span");
      chk.className = "card-sub-box";
      chk.title = s.done ? "체크 해제" : "체크";
      chk.addEventListener("click", function (e) {
        e.stopPropagation();          /* 카드가 열리지 않게 */
        s.done = !s.done;
        touch(t);
        save();
        render();
      });
      row.appendChild(chk);

      const txt = document.createElement("span");
      txt.className = "card-sub-text";
      txt.textContent = s.text || "";
      row.appendChild(txt);

      /* 글자를 누르면 카드가 열립니다 (수정은 창에서) */
      box.appendChild(row);
    });

    el.appendChild(box);
  }

  /* 아랫줄 — 창을 열지 않아도 보이는 요약 */
  const mini = document.createElement("div");
  mini.className = "task-mini";

  const st = subStat(t);
  if (st.total) {
    const c = document.createElement("span");
    c.className = "mini-chip" + (st.done === st.total ? " full" : "");
    c.textContent = "☑ " + st.done + "/" + st.total;
    mini.appendChild(c);
  }

  const dd = ddayInfo(daysLeft(t.due));
  if (dd && t.column !== lastColId()) {
    const c = document.createElement("span");
    c.className = "mini-chip " + dd.cls;
    c.textContent = dd.text;
    mini.appendChild(c);
  }

  if ((t.links || []).length) {
    const c = document.createElement("span");
    c.className = "mini-chip";
    c.textContent = "🔗 " + t.links.length;
    mini.appendChild(c);
  }

  if ((t.memo || "").trim()) {
    const c = document.createElement("span");
    c.className = "mini-chip";
    c.textContent = "메모";
    mini.appendChild(c);
  }

  if (mini.children.length) el.appendChild(mini);

  el.addEventListener("click", function () { openTask(p, t); });
  return el;
}

/* ══════════════════════════════════════════
   작업 상세창
     카드를 누르면 뜹니다. 수정은 전부 여기서 합니다.
   ══════════════════════════════════════════ */
const tmOverlay = document.getElementById("tmOverlay");
const tmBox = document.getElementById("tm");
let openTaskRef = null;   /* { p, t } */

function openTask(p, t) {
  openTaskRef = { p: p, t: fillTask(t) };
  drawTask();
  tmOverlay.hidden = false;
}

function closeTask() {
  openTaskRef = null;
  tmOverlay.hidden = true;
  render();               /* 카드 겉면 요약을 갱신합니다 */
}

tmOverlay.addEventListener("click", function (e) {
  if (e.target === tmOverlay) closeTask();
});

document.addEventListener("keydown", function (e) {
  if (tmOverlay.hidden) return;
  if (!dlg.overlay.hidden) return;       /* 확인창이 위에 떠 있으면 그쪽이 먼저 */
  if (e.key === "Escape") { e.preventDefault(); closeTask(); }
});

function drawTask() {
  if (!openTaskRef) return;
  const p = openTaskRef.p;
  const t = openTaskRef.t;

  tmBox.innerHTML = "";

  /* ── 윗줄: 현재 칸 · 프로젝트 · 닫기 ── */
  const col = COLUMNS.filter(function (c) { return c.id === t.column; })[0] || COLUMNS[0];

  const top = document.createElement("div");
  top.className = "tm-top";
  top.innerHTML = '<span class="tm-lane tone-' + (col.tone || "neutral") + '"></span>'
    + '<span class="tm-path"></span>'
    + '<button class="tm-x" title="닫기">✕</button>';
  top.querySelector(".tm-lane").textContent = col.label;
  top.querySelector(".tm-path").textContent = p.name || "이름 없는 프로젝트";
  top.querySelector(".tm-x").addEventListener("click", closeTask);
  tmBox.appendChild(top);

  /* ── 제목 (여기서 수정) ── */
  const title = document.createElement("textarea");
  title.className = "tm-title";
  title.rows = 1;
  title.placeholder = "작업 내용";
  title.value = t.text || "";
  title.addEventListener("input", function () {
    t.text = title.value;
    autoGrow(title);
    touch(t); save();
  });
  title.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    if (e.isComposing || e.keyCode === 229) return;   /* 한글 조합 확정 */
    if (e.shiftKey) return;
    e.preventDefault();
    title.blur();
  });
  tmBox.appendChild(title);
  requestAnimationFrame(function () { autoGrow(title); });

  /* ── 상태 ── */
  const rState = document.createElement("div");
  rState.className = "tm-row";
  rState.innerHTML = '<span class="tm-lbl">상태</span>';
  const segState = document.createElement("div");
  segState.className = "tm-seg";
  COLUMNS.forEach(function (c) {
    const b = document.createElement("button");
    b.className = t.column === c.id ? "on" : "";
    b.textContent = c.label;
    b.addEventListener("click", function () {
      t.column = c.id;
      touch(t); save();
      drawTask();
    });
    segState.appendChild(b);
  });
  rState.appendChild(segState);
  tmBox.appendChild(rState);

  /* ── 마감일 ── */
  const rDue = document.createElement("div");
  rDue.className = "tm-row";
  rDue.innerHTML = '<span class="tm-lbl">마감</span>';

  const due = document.createElement("input");
  due.type = "date";
  due.className = "tm-in";
  due.style.width = "150px";
  due.value = t.due || "";
  due.addEventListener("change", function () {
    t.due = due.value;
    touch(t); save();
    drawTask();
  });
  rDue.appendChild(due);

  const dd = ddayInfo(daysLeft(t.due));
  const ddChip = document.createElement("span");
  ddChip.className = "mini-chip " + (dd ? dd.cls : "");
  ddChip.textContent = dd ? dd.text : "없음";
  rDue.appendChild(ddChip);
  tmBox.appendChild(rDue);

  /* ── 우선순위 ── */
  const rPrio = document.createElement("div");
  rPrio.className = "tm-row";
  rPrio.innerHTML = '<span class="tm-lbl">우선순위</span>';
  const segPrio = document.createElement("div");
  segPrio.className = "tm-seg";
  [["low", "낮음"], ["normal", "보통"], ["high", "높음"]].forEach(function (pair) {
    const b = document.createElement("button");
    b.className = (t.priority === pair[0] ? "on" : "") + (pair[0] === "high" ? " hot" : "");
    b.textContent = pair[1];
    b.addEventListener("click", function () {
      t.priority = pair[0];
      touch(t); save();
      drawTask();
    });
    segPrio.appendChild(b);
  });
  rPrio.appendChild(segPrio);
  tmBox.appendChild(rPrio);

  /* ── 세부 항목 ── */
  const st = subStat(t);
  const secSub = document.createElement("div");
  secSub.className = "tm-sec";
  secSub.innerHTML = '<b>세부 항목</b>'
    + '<div class="tm-bar"><div class="tm-fill"></div></div>'
    + '<span class="tm-pct"></span>';
  const fill = secSub.querySelector(".tm-fill");
  fill.style.width = st.pct + "%";
  fill.classList.toggle("full", st.total > 0 && st.done === st.total);
  secSub.querySelector(".tm-pct").textContent = st.total ? st.done + "/" + st.total + " · " + st.pct + "%" : "없음";
  tmBox.appendChild(secSub);

  t.subs.forEach(function (s) {
    const row = document.createElement("div");
    row.className = "sub" + (s.done ? " on" : "");

    const box = document.createElement("div");
    box.className = "sub-box";
    box.addEventListener("click", function () {
      s.done = !s.done;
      touch(t); save();
      drawTask();
      render();          /* 뒤에 있는 카드도 같이 갱신 */
    });
    row.appendChild(box);

    const txt = document.createElement("input");
    txt.className = "sub-text";
    txt.value = s.text || "";
    txt.addEventListener("input", function () { s.text = txt.value; touch(t); save(); });
    row.appendChild(txt);

    const del = document.createElement("button");
    del.className = "sub-del";
    del.textContent = "×";
    del.title = "이 항목 삭제";
    del.addEventListener("click", function () {
      t.subs = t.subs.filter(function (x) { return x.id !== s.id; });
      touch(t); save();
      drawTask();
    });
    row.appendChild(del);

    tmBox.appendChild(row);
  });

  /* 세부 항목 추가 — 적고 Enter 로 계속 넣습니다 */
  const subAdd = document.createElement("input");
  subAdd.className = "tm-in";
  subAdd.placeholder = "세부 항목을 적고 Enter";
  subAdd.style.marginTop = "6px";
  subAdd.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    if (e.isComposing || e.keyCode === 229) return;
    e.preventDefault();
    const v = subAdd.value.trim();
    if (!v) return;
    t.subs.push({ id: "s" + Date.now() + Math.random().toString(36).slice(2, 5), text: v, done: false });
    touch(t); save();
    drawTask();
    const box = tmBox.querySelector(".tm-in[placeholder^='세부']");
    if (box) box.focus();
  });
  tmBox.appendChild(subAdd);

  /* ── 참고 링크 ── */
  const secLink = document.createElement("div");
  secLink.className = "tm-sec";
  secLink.innerHTML = '<b>참고 링크</b>';
  tmBox.appendChild(secLink);

  t.links.forEach(function (l) {
    const row = document.createElement("div");
    row.className = "lnk";

    const a = document.createElement("a");
    a.href = l.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = "🔗 " + (l.url || "");
    row.appendChild(a);

    const del = document.createElement("button");
    del.className = "sub-del";
    del.style.opacity = "1";
    del.textContent = "×";
    del.title = "이 링크 삭제";
    del.addEventListener("click", function () {
      t.links = t.links.filter(function (x) { return x.id !== l.id; });
      touch(t); save();
      drawTask();
    });
    row.appendChild(del);

    tmBox.appendChild(row);
  });

  const linkAdd = document.createElement("input");
  linkAdd.className = "tm-in";
  linkAdd.placeholder = "주소를 붙여넣고 Enter";
  linkAdd.style.marginTop = "6px";
  linkAdd.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    if (e.isComposing || e.keyCode === 229) return;
    e.preventDefault();
    let v = linkAdd.value.trim();
    if (!v) return;
    if (!/^https?:\/\//i.test(v)) v = "https://" + v;   /* http 가 없으면 붙여 줍니다 */
    t.links.push({ id: "l" + Date.now() + Math.random().toString(36).slice(2, 5), url: v });
    touch(t); save();
    drawTask();
  });
  tmBox.appendChild(linkAdd);

  /* ── 메모 ── */
  const secMemo = document.createElement("div");
  secMemo.className = "tm-sec";
  secMemo.innerHTML = '<b>메모</b>';
  tmBox.appendChild(secMemo);

  const memo = document.createElement("textarea");
  memo.className = "tm-memo";
  memo.placeholder = "이 작업에 대한 메모";
  memo.value = t.memo || "";
  memo.addEventListener("input", function () { t.memo = memo.value; touch(t); save(); });
  tmBox.appendChild(memo);

  /* ── 날짜 ── */
  const stamp = document.createElement("div");
  stamp.className = "tm-stamp";
  stamp.textContent = stampText(t);
  tmBox.appendChild(stamp);

  /* ── 아래 버튼 ── */
  const foot = document.createElement("div");
  foot.className = "tm-foot";

  const del = document.createElement("button");
  del.className = "btn";
  del.style.color = "var(--pj-danger)";
  del.textContent = "삭제";
  del.addEventListener("click", function () {
    ask({
      title: "작업 삭제",
      desc: t.text || "(내용 없음)",
      ask: "정말로 삭제하시겠습니까?",
      okText: "삭제",
      danger: true
    }).then(function (ok) {
      if (!ok) return;
      p.tasks = p.tasks.filter(function (x) { return x.id !== t.id; });
      save();
      closeTask();
    });
  });
  foot.appendChild(del);

  const close = document.createElement("button");
  close.className = "btn primary";
  close.textContent = "확인";
  close.addEventListener("click", closeTask);
  foot.appendChild(close);

  tmBox.appendChild(foot);
}

/* ── 추가 ─────────────────────────────── */
function addTask(p, colId) {
  const col = COLUMNS.filter(function (c) { return c.id === colId; })[0];

  ask({
    title: "새 작업",
    desc: (p.name || "이름 없는 프로젝트") + " · " + (col ? col.label : ""),
    input: true,
    placeholder: "작업 내용을 입력하세요",
    ask: "정말로 추가하시겠습니까?",
    okText: "추가"
  }).then(function (text) {
    if (!text) return;
    p.tasks.push({
      id: "t" + Date.now() + Math.random().toString(36).slice(2, 6),
      text: text,
      column: colId
    });
    save();
    render();
  });
}

function addTemplate(p, colId) {
  ask({
    title: "기본 세트 추가",
    desc: TODO_TEMPLATE.join(" · "),
    ask: "위 " + TODO_TEMPLATE.length + "개를 정말로 추가하시겠습니까?",
    okText: "추가"
  }).then(function (ok) {
    if (!ok) return;
    TODO_TEMPLATE.forEach(function (text, i) {
      p.tasks.push({ id: "t" + Date.now() + "_" + i, text: text, column: colId });
    });
    save();
    render();
  });
}

function addProject() {
  ask({
    title: "새 프로젝트",
    input: true,
    placeholder: "프로젝트 이름을 입력하세요",
    ask: "정말로 추가하시겠습니까?",
    okText: "추가"
  }).then(function (name) {
    if (!name) return;

    const p = {
      id: "p" + Date.now(),
      name: name,               /* 입력한 이름으로 바로 만듭니다 */
      client: "",
      due: "", amount: 0,
      deposit: false, balance: false,
      memo: "",
      tasks: [],
      createdAt: Date.now()
    };
    projects.push(p);           /* 오른쪽 끝에 탭이 붙습니다 */
    activeId = p.id;
    save();
    render();

    /* 탭이 많으면 새 탭이 보이도록 스크롤 */
    tabrow.scrollLeft = tabrow.scrollWidth;
  });
}

/* ── 요약 ─────────────────────────────── */
function updateSummary() {
  const doneN = projects.filter(isFinished).length;
  const last  = lastColId();

  /* 진행중 = 가운데 칸들, 남은 작업 = 완료 칸이 아닌 모든 작업 */
  const doingN = COLUMNS.slice(1, -1).reduce(function (s, c) { return s + countIn(c.id); }, 0);
  const leftN  = COLUMNS.filter(function (c) { return c.id !== last; })
                        .reduce(function (s, c) { return s + countIn(c.id); }, 0);

  document.getElementById("sumTotal").innerHTML = projects.length + '<span class="sum-unit">개</span>';
  document.getElementById("sumDoing").innerHTML = doingN + '<span class="sum-unit">개</span>';
  document.getElementById("sumLeft").innerHTML  = leftN + '<span class="sum-unit">개</span>';
  document.getElementById("sumDone").innerHTML  = doneN + '<span class="sum-unit">개</span>';
}

render();
loadFromServer();
</script>
