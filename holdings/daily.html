<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>데일리분석 — KJC Holdings</title>

  <!-- 개발용 캐시 무효화 (서비스 워커와 병행) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="../assets/css/common.css" />
  <link rel="stylesheet" href="../assets/css/nav.css" />
  <link rel="stylesheet" href="./css/frame.css" />
  <link rel="stylesheet" href="./css/home.css" />
  <link rel="stylesheet" href="./css/daily.css" />
</head>
<!-- kh-daily — 좁은 화면에서 오른쪽 칸을 살리려고 붙인다.
     frame.css 가 1280px 이하에서 .kh-side 를 숨기는데, 이 화면의 그 자리는
     관심종목이 아니라 「폰에 이렇게 도착합니다」 라 없어지면 안 된다.
     daily.css 안에서만 되살리고 다른 화면은 건드리지 않는다. -->
<body class="kh-daily" data-nav="holdings" data-site-root="../">

<div id="site-nav"></div>

<div class="kh-app">
  <main class="kh-main">

    <!-- 카테고리 탭 — 다른 화면과 같은 줄 -->
    <nav class="kh-cat" aria-label="카테고리">
      <a href="./index.html">홈</a>
      <a href="#">국내</a>
      <a href="#">미국 · 글로벌</a>
      <a href="#">가상자산</a>
      <a href="#">시장지표</a>
      <a href="./news.html">뉴스 · 공시</a>
      <a class="is-on" href="./daily.html">데일리분석</a>
      <span class="kh-cat-my">내 기록</span>
    </nav>

    <!-- 머리말 · 카드 · 「지난 분석」 은 js/components/daily-view.js 가 채운다.
         모달도 같은 파일을 쓴다 — 두 벌로 두면 한쪽에만 칸이 생긴다
         (holdings/CLAUDE.md 「모달이 원본이고, 목록·카드는 거기서 덜어낸 일부다」). -->

  </main>

  <aside class="kh-side kh-dl-side" id="kh-side" aria-label="보낼 문안">
    <!-- 보낼 문안. 본문과 같은 데이터로 만들기 때문에 나란히 놓고 보면
         어긋난 곳이 바로 보인다. 채우는 것은 위와 같은 파일이다. -->
  </aside>
  <nav class="kh-vbar" id="kh-vbar" aria-label="화면 전환"></nav>
</div>


<!-- 서비스 워커는 개발 중에만 등록한다. 배포본에서는 지운다. -->
<script type="module">
  import { bootServiceWorker } from './js/sw-boot.js';
  bootServiceWorker();
</script>
<script type="module" src="./js/daily.js"></script>
<script src="../assets/js/main.js"></script>
</body>
</html>
