<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>KJC Holdings — 내 주식 정리실</title>
  <meta name="description" content="관심종목·시세·차트를 한 곳에서 보고 정리하는 개인 투자 도구" />

  <!-- 개발용 캐시 무효화 (서비스 워커와 병행) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- 색·모서리는 theme.css 한 곳에서 정한다 -->
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="../assets/css/common.css" />
  <link rel="stylesheet" href="../assets/css/nav.css" />
  <link rel="stylesheet" href="./css/frame.css" />
  <link rel="stylesheet" href="./css/home.css" />
  <!-- 모달 안에는 종목 화면이 통째로 들어간다. 그 화면의 CSS 도 함께 필요하다 -->
  <link rel="stylesheet" href="./css/stock.css" />
  <link rel="stylesheet" href="./css/news.css" />
  <link rel="stylesheet" href="./css/modal.css" />
  <!-- 「데일리분석」 메뉴를 누르면 모달로 뜬다 (2026-09-21 지시). 그 내용의 CSS -->
  <link rel="stylesheet" href="./css/daily.css" />
</head>
<body data-nav="holdings" data-site-root="../">

<!-- 국기·지표 아이콘 — 화면에는 안 보이고, 아래에서 <use> 로 꺼내 쓴다.
     이모지(🇰🇷)를 쓰면 윈도우에서 "KR" 같은 지역코드 글자로 나온다. 그래서 직접 그렸다.
     여기 색은 실제 국기 색이라 theme.css 변수를 쓰지 않는다. 테마가 바뀌어도
     태극기는 태극기여야 한다 (색 하드코딩 금지 규칙의 의도적 예외). -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="kh-flag-kr" viewBox="0 0 24 24">
    <rect width="24" height="24" fill="#fff"/>
    <g transform="translate(12,12) rotate(-33)">
      <circle r="5.4" fill="#cd2e3a"/>
      <path d="M-5.4,0 A2.7,2.7 0 0 1 0,0 A2.7,2.7 0 0 0 5.4,0 A5.4,5.4 0 0 1 -5.4,0" fill="#0047a0"/>
    </g>
    <g fill="#000" transform="translate(12,12)">
      <g transform="rotate(-56) translate(0,-8.6)"><rect x="-2.4" y="-.45" width="4.8" height=".9"/><rect x="-2.4" y="1" width="4.8" height=".9"/></g>
      <g transform="rotate(56) translate(0,-8.6)"><rect x="-2.4" y="-.45" width="4.8" height=".9"/><rect x="-2.4" y="1" width="4.8" height=".9"/></g>
      <g transform="rotate(-124) translate(0,-8.6)"><rect x="-2.4" y="-.45" width="4.8" height=".9"/><rect x="-2.4" y="1" width="4.8" height=".9"/></g>
      <g transform="rotate(124) translate(0,-8.6)"><rect x="-2.4" y="-.45" width="4.8" height=".9"/><rect x="-2.4" y="1" width="4.8" height=".9"/></g>
    </g>
  </symbol>
  <symbol id="kh-flag-us" viewBox="0 0 24 24">
    <rect width="24" height="24" fill="#fff"/>
    <g fill="#b22234">
      <rect y="0" width="24" height="1.85"/><rect y="3.7" width="24" height="1.85"/>
      <rect y="7.4" width="24" height="1.85"/><rect y="11.1" width="24" height="1.85"/>
      <rect y="14.8" width="24" height="1.85"/><rect y="18.5" width="24" height="1.85"/>
      <rect y="22.2" width="24" height="1.8"/>
    </g>
    <rect width="11" height="12.95" fill="#3c3b6e"/>
    <g fill="#fff">
      <circle cx="2" cy="2.2" r=".72"/><circle cx="5.5" cy="2.2" r=".72"/><circle cx="9" cy="2.2" r=".72"/>
      <circle cx="3.75" cy="4.7" r=".72"/><circle cx="7.25" cy="4.7" r=".72"/>
      <circle cx="2" cy="7.2" r=".72"/><circle cx="5.5" cy="7.2" r=".72"/><circle cx="9" cy="7.2" r=".72"/>
      <circle cx="3.75" cy="9.7" r=".72"/><circle cx="7.25" cy="9.7" r=".72"/>
    </g>
  </symbol>
</svg>

<div id="site-nav"></div>

<!-- kh-app-wide — 오른쪽 칸이 넓은 배치 (2026-09-17).
     세로 아이콘 바를 빼고 그 폭을 실시간 순위에 넘겼다. 첫 화면만 이렇다. -->
<div class="kh-app kh-app-wide">
  <main class="kh-main">
    <!-- 공지 띠는 2026-09-17 에 뺐다.
         늘 같은 말이 떠 있어 자리만 먹었고, 없애니 아래 것들이
         그 높이만큼 올라와 첫 화면에 차트가 더 들어온다. -->

    <!-- 카테고리 탭 — 아직 어디로도 가지 않는다 (연결 예정) -->
    <nav class="kh-cat" aria-label="카테고리">
      <a class="is-on" href="#">홈</a>
      <!-- 「관심」 은 2026-09-22 에 뺐다 (지시 — "홈 옆에 관심을 관심종목으로
           바꾸고 이걸 실시간순위 안에 시가총액 앞에 넣어줘").
           순위표 칩으로 갔다 — 목록이 두 곳에 있을 이유가 없다. -->
      <a href="#">국내</a>
      <a href="#">미국</a>
      <a href="#">국외</a>
      <a href="#">원자재</a>
      <a href="#">가상자산</a>
      <a href="#">시장지표</a>
      <span class="kh-cat-my">내 기록</span>
    </nav>

    <!-- 장 상태 -->
    <!-- 자주 보는 넷(코스피 · 코스닥 · 나스닥 종합 · S&P 500)은 장 상태 줄 위에.
         나머지는 아래 「주요 지수」 카드에 들어간다 (2026-09-17 지시). -->
    <!-- 지수 띠 — 열넷을 **한 줄**에 두고 좌우 화살표로 민다 (2026-09-22 지시).
         전에는 자주 보는 넷만 여기 있고 나머지는 아래 「주요 지수」 카드에
         있었다. 같은 것이 두 자리에 있어서 카드를 없애고 여기로 합쳤다.

         갈래 띠(위)를 누르면 걸러진다 — 홈은 전부, 국내는 넷, 미국은 여섯,
         국외는 둘, 원자재는 둘. **거르기라 개수는 줄지만 띠 높이는 안 바뀐다.** -->
    <div class="kh-ixbar">
      <button class="kh-ixbar-btn" type="button" data-ix-nav="-1"
        aria-label="왼쪽으로">‹</button>
      <div class="kh-top-ix" id="kh-top-ix"></div>
      <!-- 「가상자산」·「시장지표」 를 눌렀을 때. 그 갈래의 지수를 아직 못 받는다.
           빈 띠로 두면 「연결이 안 된 건지 값이 없는 건지」 구분이 안 된다. -->
      <div class="kh-ix-todo" id="kh-ix-todo" hidden>이 갈래의 지수는 아직 연결하지 않았습니다</div>
      <button class="kh-ixbar-btn" type="button" data-ix-nav="1"
        aria-label="오른쪽으로">›</button>
    </div>
    <div class="kh-mkt" id="kh-mkt"></div>

    <!-- 지수 띠 — 좌우로 넘긴다 -->
    <!-- 지수 띠는 2026-09-17 에 아래 「주요 지수」 카드로 옮겼다.
         좌우로 밀어 보던 것을 칩(국내·미국·해외·기타)으로 거르는 방식으로 바꿨다. -->

    <!-- 고른 종목 + 오른쪽 패널

         **여기는 2026-09-17 까지 지수 차트였다.** 지수는 하루에 몇 번
         보지 않는데 화면에서 가장 큰 자리를 먹고 있었다 (지시 —
         "지수차트는 많이 안볼거같으니 지수차트 있는곳에 국내종목에
         상위에 있는 종목이 나오도록 바꾸고").

         무엇을 보여주나 — 처음 켜면 코스피 1위, 그다음부터는 마지막에
         마우스를 올렸던 종목이다. 목록에서 마우스를 옮기면 여기가 따라 바뀐다.

         지수 값은 위의 카드 띠에 그대로 있다. -->
    <section class="kh-idx" aria-label="고른 종목">
      <div class="kh-card kh-idx-main">
        <div class="kh-idx-head">
          <span class="kh-ic" id="kh-big-ic"></span>
          <b class="kh-idx-name" id="kh-idx-name">불러오는 중</b>
          <span class="kh-idx-v kh-num kh-mut" id="kh-big-v"></span>
          <span class="kh-idx-ai">✨ AI <span class="kh-mut">연결 예정</span></span>
          <!-- 52주 최저·최고는 옆 패널에 있었는데 머리줄로 올렸다 (2026-09-17 지시).
               칸을 따로 쓰지 않고 그 종목 이름 옆에 붙는다. -->
          <span class="kh-head-yr" id="kh-year-range">불러오는 중</span>
          <a class="kh-fold" id="kh-big-link" href="./stock.html">자세히 ›</a>
        </div>
        <!-- 기간 고르기 — 이름 아래 줄에 둔다 (2026-09-15 지시).
             「보조지표」 는 그 오른쪽. 기간 줄 **안**에 넣으면 안 된다 —
             home.js 가 그 줄을 innerHTML 로 다시 그려서 지워진다 (2026-09-18). -->
        <div class="kh-per-row">
          <div class="kh-idx-per" id="kh-idx-per"></div>
          <div class="kh-ind-menu">
            <button type="button" class="kh-ind-open">보조지표 <i>⌄</i></button>
            <div class="kh-ind-list" hidden></div>
          </div>
          <!-- 세부사항 — 보조지표 옆 (2026-09-21 지시).
               오른쪽 패널에 있던 것을 여기로 옮겼다. **「자세히」 단추는 두지
               않는다** — 종목 이름 줄의 것 하나만 남는다.
               components/stock-detail.js 가 채운다. -->
          <div class="kh-dt" id="kh-dt"></div>
        </div>
        <div class="kh-idx-chart" id="kh-big-chart"></div>
        <div class="kh-big-foot" id="kh-big-foot">
          <span>60거래일 추이</span><span>한국투자증권 실시간</span>
        </div>
      </div>

      <!-- 오른쪽 패널 — 왼쪽 차트의 그 종목 이야기다.

           프로그램 매매(차익·비차익)는 뺐다. 지수 단위로만 나오는 값이라
           종목 화면에 둘 자리가 아니다. 지수 화면이 생기면 그때 되살린다. -->
      <!-- 고른 종목 패널 — 투자자 정보 · AI 분석 · 종목 뉴스가 1/3씩
           (2026-09-21 지시).

           **마크업을 여기 두지 않는다.** 같은 셋이 모달·종목 화면에도 나오므로
           `components/stock-panel.js` 가 만들어 양쪽이 같은 것을 쓴다 —
           한쪽만 고쳐져 갈라지는 것을 막는다.

           세부사항은 차트 머리줄로 갔고, 매수·매도 비율도 그쪽에 붙었다. -->
      <aside class="kh-card kh-idxp" id="kh-panel3" aria-label="종목 정보"></aside>
    </section>

    <!-- 본문 아래 — 카드 다섯.
         탭 하나에 묶여 있던 「지금 뜨는 산업」·「외국인 · 기관 매매」를 떼어
         제 카드로 만들었고(2026-09-17 지시), 관심 사이드바에 있던
         주요 일정·뉴스도 여기로 내렸다. 실시간 순위와 공시는 오른쪽 칸이다. -->
    <section class="kh-rank" aria-label="시장 정보">

      <!-- 지금 뜨는 산업 — 업종 이름을 단추로 놓고, 누르면 그 종목이 아래에
           나온다 (2026-09-18 지시 · 시안 「나안」).
           값은 네이버에서 온다 — KIS 에는 「그 업종에서 몇이 올랐나」와
           「그 업종의 종목 목록」이 없다. js/components/sectors.js 참고. -->
      <div class="kh-card kh-sc-card">
        <!-- 업종·테마 고르개는 「주요 지수」 카드처럼 탭 줄 오른쪽에 둔다.
             줄을 따로 두면 카드가 그만큼 길어지고, 이 줄의 카드 넷이
             함께 늘어난다 (2026-09-17 지시 — 높이를 유지한다). -->
        <div class="kh-tabs"><button class="kh-tab is-active">지금 뜨는 산업</button>
          <span class="kh-chips kh-ix-chips" id="kh-sc-kind">
            <button class="kh-chip is-active" data-kind="industry">업종</button>
            <button class="kh-chip" data-kind="theme">테마</button>
          </span>
          <!-- 차트 머리줄의 「자세히 ›」 와 **같은 것**이어야 한다
               (2026-09-22 지시 — "자세히 버튼은 차트에서 모달 띄우는
                버튼으로 다 통일해줘"). href 가 없고 JS 가 모달을 연다. -->
          <a class="kh-fold" id="kh-sc-more" role="button" tabindex="0">자세히 ›</a></div>
        <div class="kh-chips kh-sc-names" id="kh-sc-names"></div>
        <div class="kh-sc-body" id="kh-sc-body"></div>
      </div>

      <!-- 「주요 지수」 카드는 2026-09-22 에 없앴다 (지시).
           위 지수 띠에 열넷이 다 들어가서, 같은 것이 두 자리에 있게 됐다.
           칩 넷(국내·미국·해외·기타)도 함께 없앴다 — 갈래 띠가 그 일을 한다. -->

      <!-- 뉴스와 주요 일정은 2026-09-21 에 오른쪽 기둥의 「뉴스 | 공시 | 주요일정」
           칸으로 옮겼다. **여기 두 자리는 빈 채로 둔다** — 재권님 지시로 지금
           뜨는 산업과 주요 지수를 늘려 채우지 않는다 (「원래로 되돌리고 비워둔다」).
           그래서 `.kh-rank` 의 칸 수(1fr 1fr 1fr 340px)를 **줄이지 않는다.**
           줄이면 남은 둘이 넓어진다 — 실제로 263 이 402 가 됐다.

           **앞 자리(원래 뉴스)에 데일리분석을 넣었다** (2026-09-21 지시 —
           "기존에 뉴스였던곳에 넣어줘"). 뒤 340px 는 그대로 비워 둔다. -->

      <!-- 데일리분석 — 모달이 원본이고 이 카드는 거기서 덜어낸 일부다
           (holdings/CLAUDE.md 「모달이 원본이고, 목록·카드는 거기서 덜어낸 일부다」).
           모달 첫 칸인 「주요 지수」 를 세 줄로 줄여 놓는다.

           「자세히 ›」 는 차트 머리줄과 같은 모양(.kh-fold)이고, href 가
           daily.html 이라 daily-view.js 의 bindDailyMenu 가 눌렀을 때 모달로
           바꾼다. **새로 부르는 코드가 없다** — 그 함수가 문서 전체의
           a[href$="daily.html"] 를 이미 잡는다 (home.js 끝에서 한 번 부른다).
           JS 가 죽어도 링크는 살아 화면으로 넘어간다. -->
      <div class="kh-card">
        <div class="kh-tabs"><button class="kh-tab is-active">데일리분석</button>
          <a class="kh-fold" href="./daily.html">자세히 ›</a></div>
        <div class="kh-dlm" id="kh-dlm">불러오는 중</div>
      </div>

    </section>
  </main>

  <!-- 오른쪽 칸 — 실시간 순위와 공시.
       관심종목 목록이 있던 자리다. 목록이 두 곳에 있을 이유가 없어
       「관심」 칩으로 순위표 안에 넣었다 (2026-09-17 지시). -->
  <aside class="kh-side" id="kh-side" aria-label="실시간 순위">
    <div class="kh-side-wrap">

      <div class="kh-card kh-rank-card">
        <div class="kh-tabs">
          <button class="kh-tab is-active">실시간 순위</button>
          <!-- 「▤ 요약 접기」 였다 (2026-09-21 지시로 바꿈).
               **아무것도 안 접고 있었다** — kh-fold 가 JS 어디에서도 안 쓰여
               눌러도 아무 일이 없는 장식이었다. 없애도 잃을 것이 없다.
               클래스 이름은 남긴다 — 차트 머리줄의 「자세히 ›」 가 같은 것을
               쓰고 CSS 도 그 이름으로 걸려 있다. -->
          <!-- 차트 머리줄의 「자세히 ›」 와 **같은 것**이어야 한다
               (2026-09-22 지시 — "자세히 버튼은 차트에서 모달 띄우는
               버튼으로 다 통일해줘").

               <button> 이었는데 <a> 로 바꿨다. 버튼은 브라우저 기본이
               따라붙어 모양이 갈린다 — 재서 **열한 가지가 달랐다**
               (테두리 2px outset · 폰트 Arial · 배경 #f0f0f0 · 모서리 0 …).

               **href 는 없다.** 차트 쪽은 stock.html 이 있어 가운데 단추로
               새 탭에 열 수 있지만, 순위는 갈 화면이 없다 — 모달이 그 자리다.
               없는 주소를 적어 두면 가운데 단추로 눌렀을 때 빈 곳으로 간다. -->
          <a class="kh-fold" id="kh-rank-more" role="button" tabindex="0">자세히 ›</a>
        </div>
        <!-- 칩은 **js/home.js 의 SORTS 가 만든다** (2026-09-22).
             전에는 여기 다섯을 적어 두고 모달은 SORTS 로 만들어서 **같은
             목록이 두 곳에** 있었다. 한 곳에서 만들면 갈릴 수가 없다. -->
        <div class="kh-chips" id="kh-sorts">
          <!-- 즐겨찾기로 담은 개수. 하트를 눌렀을 때 어디로 갔는지 보인다.
               칩이 아니라서 setupSorts 가 지우지 않고 뒤에 다시 붙인다 -->
          <span class="kh-fav-count" id="kh-fav-count"></span>
        </div>
        <!-- 지금 어느 기준으로 줄 세웠는지, 값이 몇 분 전 것인지 적는다.
             급상승·급하락은 거래대금이 적은 종목을 빼므로 그 기준도 함께. -->
        <div class="kh-sort-note" id="kh-sort-note"></div>
        <div class="kh-asof" id="kh-asof">· 오늘 기준</div>
        <!-- 표는 제 안에서 스크롤된다. 페이지가 통째로 내려가면
             지수와 차트가 화면 밖으로 밀려난다 (2026-09-14 지시) -->
        <div class="kh-rank-scroll" id="kh-rank-scroll">
          <table>
            <thead>
              <tr>
                <!-- 넷째 칸의 이름은 고른 순위 단추에 따라 바뀐다 (home.js 의 paintRowHead) -->
                <th></th><th class="l">종목</th><th>현재가</th>
                <th id="kh-th-metric">시가총액</th><th>등락률</th>
              </tr>
            </thead>
            <tbody id="kh-rows"></tbody>
          </table>
          <!-- 아래로 내리면 다음 15개가 이어 붙는다 -->
          <div class="kh-more" id="kh-more"></div>
        </div>
      </div>

      <!-- 뉴스와 공시를 한 칸에 합쳤다 (2026-09-21 지시 — 「실시간 순위 밑으로 합쳐줘」).
           전에는 뉴스가 왼쪽 `kh-rank` 줄에, 공시가 여기에 따로 있었다.
           탭으로 갈아끼우므로 **칸 높이는 둘 중 어느 것을 봐도 같아야 한다**
           (CLAUDE.md 「보는 것을 바꿔도 자리는 그대로다」). 높이는
           `.kh-sec-card > .kh-sched-b` 의 천장(150px)이 잡는다. -->
      <div class="kh-card kh-sec-card kh-dc-card kh-nwdc-card">
        <div class="kh-sched-h">
          <span class="kh-nwdc-tabs">
            <button type="button" class="kh-nwdc-t is-on" data-nwdc="news">뉴스</button>
            <button type="button" class="kh-nwdc-t" data-nwdc="dc">공시</button>
            <button type="button" class="kh-nwdc-t" data-nwdc="sched">주요일정</button>
          </span>
          <!-- 「자세히」 는 **탭 옆**에 둔다 (2026-09-21 지시 — 「뉴스 공시 주요일정
               옆에 자세히 칸 있어야 하고」). 칸 아래에 있던 「더보기」 를 여기로
               옮기고 이름을 맞췄다 — 같은 일을 하는 단추가 둘이면 어느 것을
               눌러야 할지 묻게 된다.
               **클래스를 `kh-fold` 로 합쳤다** (2026-09-22 지시 — 「자세히
               통일 작업에 함께 정리해」). 전에는 `kh-sec-more` 였는데, 같은
               글자 「자세히 ›」 가 모양이 둘이었다. 이제 이 저장소에서
               「자세히」 는 `kh-fold` 하나다.
               모달은 `data-modal="news"` 로 걸린다 — 클래스가 아니라 그
               속성을 보므로(news-modal.js) 바꿔도 안 끊긴다. -->
          <span class="kh-nwdc-side">
            <span class="kh-mut" id="kh-nwdc-src">경제지</span>
            <a class="kh-fold" href="./news.html" data-modal="news">자세히 ›</a>
          </span>
        </div>
        <div class="kh-sched-b">
          <div id="kh-side-news"></div>
          <div class="kh-dc" id="kh-dc-all" hidden></div>
          <div id="kh-side-sched" hidden></div>
        </div>
      </div>

    </div>
  </aside>
</div>

<div class="kh-foot" id="kh-foot" aria-label="시세 띠"></div>

<!-- 차트 라이브러리 — holdings 안에 둔다. 이 구역만 쓰기 때문이다 -->
<script src="./js/vendor/lightweight-charts.js"></script>
<!-- 서비스 워커는 개발 중에만 등록한다. 배포본에서는 지운다.
     세 화면이 같은 코드를 들고 있던 것을 js/sw-boot.js 로 모았다 (2026-09-15) -->
<script type="module">
  import { bootServiceWorker } from './js/sw-boot.js';
  bootServiceWorker();
</script>
<script type="module" src="./js/home.js"></script>
<script src="../assets/js/main.js"></script>
</body>
</html>
