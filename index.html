<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>KJC Studio — Creative Digital Studio</title>
  <meta name="description" content="KJC Studio. 3D Modeling, AI Work, Web·Interactive, Branding. 크리에이티브 디지털 스튜디오." />
  <!-- 개발용 캐시 무효화: CSS/JS 를 고쳤을 때 새로고침만으로 반영되도록 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400;1,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/nav.css" />
  <link rel="stylesheet" href="assets/css/gallery.css" />
  <link rel="stylesheet" href="assets/css/home.css" />
</head>
<body data-nav="home" data-site-root="">

  <!-- Nav (동적 주입) -->
  <div id="site-nav"></div>

  <main class="home">
    <!-- 1) 첫 화면을 꽉 채우는 인트로 -->
    <section class="intro">
      <p class="intro-kicker">Creative Digital Studio</p>
      <h1 class="intro-title">KJC Studio<span class="dot">.</span></h1>
      <p class="intro-lead">
        3D 모델링부터 AI, 웹 인터랙션, 브랜딩까지.<br>
        만드는 일 전반을 하나의 파이프라인으로 다룹니다.
      </p>
      <a class="intro-scroll" href="#works">
        <span class="intro-scroll-label">Works</span>
        <span class="intro-scroll-arrow" aria-hidden="true"></span>
      </a>
    </section>

    <!-- 2) 카테고리 목록 (home.js 가 categories.json 으로 채움) -->
    <section class="cat-list" id="works" aria-label="작업 카테고리"></section>

    <!-- 3) 대표 카테고리 작업물
         제목과 그리드는 gallery.js 가 채운다. body 에 data-category 가 없으면
         categories.json 의 featured 를 대표로 삼는다 — 카테고리 페이지와 같은 코드다. -->
    <section class="home-works" aria-label="대표 작업물">
      <div class="home-works-head">
        <p class="home-works-kicker">Selected</p>
        <h2 class="category-title"></h2>
        <a class="home-works-more" href="category/3d-modeling.html">전체 보기</a>
      </div>
      <section class="gallery"></section>
    </section>
  </main>

  <!-- Footer (동적 주입) -->
  <div id="site-footer"></div>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/home.js"></script>
  <script src="assets/js/gallery.js"></script>
</body>
</html>
