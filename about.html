<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About — KJC Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/page.css" />
  <style>
    .about-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-top: 48px;
    }
    .stat-card {
      padding: 28px 24px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .stat-num {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 2.6rem;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 8px;
    }
    .stat-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    @media (max-width: 900px) {
      .about-stats { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body data-nav="about" data-site-root="">
  <div id="site-nav"></div>

  <main class="page">
    <section class="page-hero">
      <p class="kicker">About Us</p>
      <h1>Creative<br>Studio<span class="dot">.</span></h1>
      <p class="lead">
        KJC Studio는 3D, AI, 인터랙티브, 브랜딩을 아우르는 크리에이티브 디지털 스튜디오입니다.
        생각을 시각으로 옮기는 모든 과정을 함께 설계합니다.
      </p>
    </section>

    <section class="content-block">
      <div class="two-col">
        <div>
          <p class="block-label">Numbers</p>
          <h2>지난 5년,<br>우리가 만든 것들.</h2>
          <p>
            웹사이트, 브랜딩, 디지털 마케팅, UI/UX 디자인을 아우르는
            종합 크리에이티브 스튜디오로 성장해왔습니다.
            전문 팀이 고객사의 목표를 함께 이루는 진정한 파트너가 됩니다.
          </p>
        </div>
        <div>
          <div class="about-stats">
            <div class="stat-card">
              <div class="stat-num">120+</div>
              <div class="stat-label">완료 프로젝트</div>
            </div>
            <div class="stat-card">
              <div class="stat-num">80+</div>
              <div class="stat-label">고객사</div>
            </div>
            <div class="stat-card">
              <div class="stat-num">5년</div>
              <div class="stat-label">업력</div>
            </div>
            <div class="stat-card">
              <div class="stat-num">98%</div>
              <div class="stat-label">고객 만족도</div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/main.js"></script>
</body>
</html>
