<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>돈의 흐름 지도 · Insight</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/theme.css" />
<!-- 지도 엔진 (2026-10-03 지시 — 「금리와 주식시장의 상관관계를 AI 생태계 지도처럼 · 유가도 · 북극항로 생태계 지도도」).
     지도가 셋이 되어 AI 생태계 화면(ecosystem.html)을 복사하지 않고 **자료 파일 하나가 한 지도**가 되게 했다 —
     flowmap.html?map=<이름> 이 data/maps/<이름>.json 을 읽어 세계 지도(지구본)와 흐름도를 그린다.
     자료 파일 모양은 data/maps/README.md. AI 생태계는 data/maps/ai.json 으로 옮겼고 ecosystem.html 은 여기로 넘긴다.
     Insight 첫 화면 모달이 이 페이지를 그대로 띄운다 — 주소로 직접 들어와도 같은 것이 열린다 -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text-primary); font-family: 'Noto Sans KR', sans-serif; }
  .wrap { padding: 22px 20px 28px; display: grid; grid-template-columns: 1fr 240px; gap: 20px; min-width: 1180px; }
  /* .view 위아래에 쌓이는 것의 높이 — 위 padding + h1 + .sub + .views + .bar + 아래 padding (2026-10-02 헤드리스 실측 214).
     모달(iframe) 안에서는 모달 머리가 제목을 들고 있어 h1 · .sub 을 숨긴다 — 그만큼 줄어든다. 바뀌면 재서 고친다 */
  :root { --eco-top: 214px; }
  .in-frame { --eco-top: 122px; }   /* 2026-10-02 헤드리스 실측 — 위 108 + 아래 14 */
  .in-frame h1, .in-frame .sub { display: none; }
  .in-frame .wrap { padding: 12px 20px 14px; }
  /* 칸 안 모드(?embed=1) — Insight 첫 화면의 돈의 흐름 칸이 이 화면을 틀로 띄운다 (2026-10-06 지시 · 「나」).
     지도만 보이게 제목 · 보기 단추 · 아래 단추 줄 · 오른쪽 패널 · 지구본 단추를 감추고, 지구본은 손대기 전까지 멈춘다(spinOn).
     흐름 · 병목 · 시나리오 · 회사 카드는 모달(큰 화면)에서 본다 */
  .embed .wrap { grid-template-columns: minmax(0, 1fr); min-width: 0; padding: 0; }   /* minmax(0,…) — 폭을 재는 동안 칸이 내용을 따라 안 늘어나게 */
  .embed h1, .embed .sub, .embed .views, .embed #bar, .embed .panel, .embed .geo-ctl, .embed .geo-note { display: none; }
  .embed .view { height: 100vh; }
  .embed #geo { height: 100%; border-radius: 0; }
  /* 칸 안 흐름도 — 종목이 다 보이게(2026-10-06 재권님). 제 폭(1100)으로 그린 뒤 fitFlow() 가 틀 크기에 맞춰 통째로 줄인다. 안에서 스크롤하지 않는다 */
  .embed #v-flow { overflow: hidden; }
  .embed #v-flow .map { width: 1100px; transform-origin: 0 0; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .sub { color: var(--text-secondary); font-size: 13px; margin: 0 0 18px; }

  .map { position: relative; display: grid; column-gap: 46px; align-items: center; }
  svg.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  /* 선 색은 종류를 뜻한다 — 글씨가 아닌 표시라 색을 그대로 쓴다. 종류별 색은 자료 파일의 lineTypes.color(토큰 이름)로 JS 가 만든다 */
  svg.links path { fill: none; stroke-width: 1.8; stroke-dasharray: 6 6; opacity: .55; transition: opacity .15s, stroke-width .15s; }
  .map.flow svg.links path { animation: eco-flow 1.2s linear infinite; }
  @keyframes eco-flow { to { stroke-dashoffset: -12; } }
  .map.focus svg.links path { opacity: .12; }
  .map.focus svg.links path.on { opacity: 1; stroke-width: 3; }
  @media (prefers-reduced-motion: reduce) { .map.flow svg.links path { animation: none; } }

  .choke::after { content: ''; position: absolute; inset: -5px; border-radius: 18px; pointer-events: none;
                  box-shadow: 0 0 0 2px var(--kh-danger); animation: eco-pulse 1.8s ease-out infinite; }
  @keyframes eco-pulse { 0% { opacity: .9; } 70% { opacity: 0; transform: scale(1.06); } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .choke::after { animation: none; } }

  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 18px; font-size: 12px; }
  .bar button { font: inherit; border: 0; border-radius: 99px; padding: 5px 12px; cursor: pointer;
                background: var(--bg-card); color: var(--text-secondary); display: inline-flex; align-items: center; gap: 6px; }
  .bar button.is-on { background: var(--accent-faint); color: var(--accent); font-weight: 700; }
  .bar .sw { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
  .bar .ring { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 2px var(--kh-danger); display: inline-block; }
  .bar .sep { width: 1px; height: 16px; background: var(--border-strong); margin: 0 4px; }
  .stk { display: inline-flex; align-items: center; gap: 3px; margin: 1px 4px 1px 0; white-space: nowrap; }
  .stk i { font-style: normal; font-size: 9.5px; font-weight: 700; padding: 0 5px; border-radius: 99px; line-height: 15px; }
  /* 등급 배지 — 첫째 accent · 둘째 ok · 셋째 warn (자료의 grades 순서) · 연한 바탕에 같은 색의 진한 글씨 */
  .g-1 i { background: var(--accent-faint); color: var(--accent); }
  .g-2 i { background: rgb(var(--kh-ok-rgb) / 10%); color: rgb(var(--kh-ok-rgb)); }
  .g-3 i { background: rgb(var(--kh-warn-rgb) / 10%); color: rgb(var(--kh-warn-rgb)); }
  .g-4 i { background: var(--kh-danger-faint); color: var(--kh-danger); }
  .bar .lg { display: inline-flex; gap: 8px; align-items: center; color: var(--text-muted); }
  .bar .lg .stk { margin: 0; }
  .node .d .stk, .cell .t .stk { font-weight: 500; }
  /* 시나리오 배지 — 「오를 때」 를 켜면 칸 모서리에 + − ± 가 뜬다 */
  .eff { display: none; position: absolute; right: -6px; top: -8px; min-width: 20px; height: 20px; border-radius: 99px; font-size: 12px; font-weight: 700;
         line-height: 20px; text-align: center; padding: 0 5px; }
  .map.sc .eff:not(:empty) { display: block; }
  .eff.up { background: rgb(var(--kh-ok-rgb) / 12%); color: rgb(var(--kh-ok-rgb)); }
  .eff.down { background: var(--kh-danger-faint); color: var(--kh-danger); }
  .eff.mixed { background: var(--bg-elevated); color: var(--text-muted); }
  .panel .choke-note { background: var(--kh-danger-faint); color: var(--kh-danger); border-radius: 8px; padding: 6px 9px; margin-top: 10px; font-size: 12px; line-height: 1.5; }

  .col { display: flex; flex-direction: column; gap: 14px; }
  .col .gap { height: 22px; }
  .col-h { color: var(--text-muted); font-size: 11px; font-weight: 700; margin-bottom: -4px; }
  .node { background: var(--bg-card); border-radius: 14px; padding: 11px 12px 13px; text-align: center;
          cursor: pointer; position: relative; z-index: 1; transition: box-shadow .15s, opacity .15s; }
  .node:hover, .cell:hover { box-shadow: var(--shadow-md); }
  .node .k { display: inline-block; background: var(--accent-faint); color: var(--accent); font-size: 11px; font-weight: 700;
             padding: 2px 9px; border-radius: 99px; margin-bottom: 7px; }
  .node .t { font-weight: 700; font-size: 14px; }
  .node .d { color: var(--text-secondary); font-size: 11.5px; margin-top: 4px; line-height: 1.5; }
  .cell { background: var(--bg-card); border-radius: 10px; padding: 8px 12px; cursor: pointer; position: relative; z-index: 1;
          transition: box-shadow .15s, opacity .15s; }
  .cell .k { color: var(--accent); font-weight: 700; font-size: 12px; display: block; }
  .cell .t { font-weight: 500; font-size: 12.5px; }
  .map.focus .node, .map.focus .cell { opacity: .35; }
  .map.focus .lit { opacity: 1; }
  .map.focus .sel { box-shadow: 0 0 0 2px var(--accent); }

  .panel { background: var(--bg-card); border-radius: 14px; padding: 16px; align-self: start; }
  .panel h2 { font-size: 15px; margin: 0 0 10px; }
  .panel .empty { color: var(--text-muted); font-size: 13px; line-height: 1.6; }
  .panel dl { margin: 0; font-size: 13px; }
  .panel dt { color: var(--text-muted); font-size: 12px; margin-top: 10px; }
  .panel dd { margin: 2px 0 0; line-height: 1.55; }
  .panel .muted { color: var(--text-muted); }
  .err { background: var(--kh-danger-faint); color: var(--kh-danger); border-radius: 10px; padding: 12px 14px; font-size: 13px; }
</style>
<!-- 세계 지도 — 지도 그림은 맥미니 /Users/kjc/data/maps 의 PMTiles 를 서버가 /maps/ 로 낸다. 라이브러리는 아직 CDN. maplibre 5.x(6 은 ESM 만) -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>
<script src="https://unpkg.com/@protomaps/basemaps@5.7.2/dist/basemaps.js"></script>
<style>
  .views { display: inline-flex; background: var(--bg-elevated); border-radius: 10px; padding: 3px; margin: 0 0 14px; }
  .views button { font: inherit; font-size: 13px; border: 0; background: none; padding: 6px 16px; border-radius: 8px;
                  cursor: pointer; color: var(--text-secondary); }
  .views button.is-on { background: var(--bg-card); color: var(--text-primary); font-weight: 700; }
  /* 두 화면이 같은 높이 — 창에서 위아래를 뺀 만큼. 흐름도가 길면 안에서 스크롤한다 — 탭을 바꿔도 자리가 안 움직인다 */
  .view { height: max(420px, calc(100vh - var(--eco-top))); overflow: auto; }
  .view[hidden] { display: none; }
  #geo { height: calc(100% - 26px); border-radius: 14px; overflow: hidden; position: relative; }
  #geo.globe { background: var(--overlay-bg); }   /* 지구본일 때는 우주처럼 어둡게 — 어둡게 두는 예외 토큰(이미지 확대 배경) */
  .geo-ctl { position: absolute; left: 10px; top: 10px; z-index: 2; display: flex; gap: 6px; }
  .geo-ctl button { font: inherit; font-size: 12px; border: 0; border-radius: 99px; padding: 5px 11px; cursor: pointer;
                    background: var(--bg-card); color: var(--text-secondary); box-shadow: var(--shadow-md); }
  .geo-ctl button.is-on { background: var(--accent-faint); color: var(--accent); font-weight: 700; }
  #geo.choke-only .pin:not(.choke) { opacity: .25; }
  .pin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--bg-card); cursor: pointer; }
  .pin.choke::after { inset: -6px; border-radius: 50%; }
  .pin .lb { position: absolute; left: 16px; top: -4px; max-width: 160px; width: max-content; line-height: 1.35; font-size: 11px; font-weight: 700;
             background: var(--bg-card); color: var(--text-primary); padding: 1px 6px; border-radius: 6px; pointer-events: none; }
  .pin .lb.left { left: auto; right: 16px; text-align: right; }
  .pin .lb[hidden] { display: none; }
  .geo-note { color: var(--text-muted); font-size: 11.5px; margin-top: 6px; }

  /* ── 회사 카드 — 종목 칩을 누르면 오른쪽에서 덮는 창 (2026-10-06 지시 — 사업 · 영업이익 · 현재가치 · 미래가치 · 출처 셋) ── */
  .stk[data-co] { cursor: pointer; }
  .stk[data-co]:hover { text-decoration: underline; text-decoration-color: var(--accent); }
  .co-wrap { position: fixed; inset: 0; z-index: 50; display: none; }
  .co-wrap.is-on { display: block; }
  .co-dim { position: absolute; inset: 0; background: var(--overlay-bg); }
  .co { position: absolute; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--bg-card); box-shadow: var(--shadow-md);
        overflow-y: auto; padding: 18px 22px 28px; box-sizing: border-box; font-size: 13px; line-height: 1.55; }
  .co h2 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .co h2 small { font-size: 12px; font-weight: 500; color: var(--text-muted); }
  .co .x { position: absolute; top: 12px; right: 14px; border: 0; background: var(--accent-faint); color: var(--accent); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
  .co .meta { color: var(--text-muted); font-size: 12px; margin: 4px 0 12px; }
  .co h3 { font-size: 13px; margin: 18px 0 6px; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; }
  .co h3 .src { font-weight: 400; font-size: 11.5px; color: var(--text-muted); margin-left: auto; }
  .co h3 .src a, .co .meta a, .co .rep a { color: var(--accent); text-decoration: none; }
  .co p { margin: 0; }
  .co table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .co th, .co td { padding: 5px 4px; border-bottom: 1px solid var(--bg-elevated); text-align: right; white-space: nowrap; }
  .co th { color: var(--text-muted); font-weight: 500; }
  .co th:first-child, .co td:first-child { text-align: left; }
  .co th.est { color: var(--accent); }
  .co td.neg { color: var(--kh-danger); }
  .co .kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .co .kv div { background: var(--bg-elevated); border-radius: 10px; padding: 8px 10px; }
  .co .kv b { display: block; font-size: 15px; }
  .co .kv span { font-size: 11.5px; color: var(--text-muted); }
  .co .rep { list-style: none; padding: 0; margin: 0; }
  .co .rep li { padding: 4px 0; border-bottom: 1px solid var(--bg-elevated); display: flex; gap: 8px; }
  .co .rep li .b { color: var(--text-muted); flex: 0 0 76px; }
  .co .rep li .d { color: var(--text-muted); margin-left: auto; flex: 0 0 auto; }
  .co .none { color: var(--text-muted); }
  .co .foot { margin-top: 18px; font-size: 11.5px; color: var(--text-muted); border-top: 1px solid var(--bg-elevated); padding-top: 8px; }
  .co .foot a { color: var(--accent); text-decoration: none; }

  /* 부품 분해도(3D) 덮는 창 — 자료 파일 info.<칸>.parts 가 있는 칸만 (2026-10-06 지시 · HBM 칸) */
  .parts-btn { border: 0; background: var(--accent-faint); color: var(--accent); border-radius: 8px; padding: 5px 10px; cursor: pointer; font: inherit; font-size: 12.5px; }
  .parts { position: absolute; inset: 24px; background: var(--bg-card); border-radius: 14px; box-shadow: var(--shadow-md); overflow: hidden; }
  .parts iframe { width: 100%; height: 100%; border: 0; display: block; }
  .parts .x { position: absolute; top: 10px; right: 12px; z-index: 2; border: 0; background: var(--accent-faint); color: var(--accent); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1 id="h1"></h1>
    <p class="sub" id="sub"></p>
    <div class="views" id="views"><button data-v="geo" class="is-on">세계 지도</button><button data-v="flow" id="flow-tab">흐름도</button></div>
    <!-- 흐름 · 갈래 · 병목 · 시나리오 · 등급 범례 — 두 화면이 같이 쓴다. 갈래 · 시나리오 · 범례 단추는 자료에서 만든다 -->
    <div class="bar" id="bar">
      <button data-act="flow" class="is-on">▶ 흐름</button>
      <span class="sep"></span>
      <span id="types"></span>
      <span class="sep"></span>
      <button data-act="choke"><span class="ring"></span>병목만 보기</button>
      <span id="scen"></span>
      <span class="sep"></span>
      <span class="lg" id="lg"></span>
    </div>
    <div class="view" id="v-flow" hidden>
      <div class="map flow" id="map"><svg class="links" id="links"></svg></div>
    </div>
    <div class="view" id="v-geo">
      <div id="geo">
        <div class="geo-ctl" id="geo-ctl">
          <button data-g="globe" class="is-on">지구본</button>
          <button data-g="spin" class="is-on">▶ 회전</button>
          <button data-g="home">처음으로</button>
        </div>
      </div>
      <div class="geo-note" id="geo-note"></div>
    </div>
  </div>
  <aside class="panel" id="panel"></aside>
</div>
<div class="co-wrap parts-wrap" id="parts-wrap" aria-hidden="true"><div class="co-dim" data-parts-close></div><div class="parts" id="parts"><button class="x" data-parts-close>닫기 ✕</button><iframe id="parts-frame" title="부품 분해도"></iframe></div></div>
<div class="co-wrap" id="co-wrap" aria-hidden="true"><div class="co-dim" data-co-close></div><aside class="co" id="co" role="dialog" aria-label="회사 카드"></aside></div>
<style id="dyn"></style>

<script>
if (window !== window.top) document.documentElement.classList.add('in-frame');   // 모달 안이면 제목 줄을 숨긴다 — 모달 머리가 제목을 들고 있다
const EMBED = !!new URLSearchParams(location.search).get('embed');   // 칸 안 모드 — 지도만 · 지구본 멈춤 (2026-10-06)
if (EMBED) document.documentElement.classList.add('embed');

const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const map = $('map'), svg = $('links'), panel = $('panel');
// 색 토큰 이름 → theme.css 변수. 자료 파일은 이 이름만 쓴다(#색 금지)
const TOKEN = { ok: '--kh-ok-rgb', accent: '--accent-rgb', warn: '--kh-warn-rgb', danger: '--kh-danger-rgb' };
const rootCss = getComputedStyle(document.documentElement);
const rgbOf = v => 'rgb(' + rootCss.getPropertyValue(v).trim().split(/\s+/).join(',') + ')';

let D = null;                    // 지도 자료
let LINKS = [], EXTRA = [], INFO = {}, STOCKS = [], GRADES = {}, GRADE_NO = {}, SITES = [], TYPES = {}, LINE_COLOR = {};
let sel = null, scenario = null;
const EMPTY = '<h2>칸을 눌러 보세요</h2><div class="empty">그 칸의 설명 · 종목 · 볼 것 · 이어진 칸이 여기 뜹니다.</div>';
const el = id => map.querySelector(`[data-id="${id}"]`);
const chip = st => `<span class="stk${st.grade ? ' g-' + (GRADE_NO[st.grade] || 4) : ''}"${(st.code || st.ticker) ? ` data-co="${esc(st.code || st.ticker)}" title="회사 카드 열기"` : ''}>${esc(st.name)}${st.grade ? `<i>${esc(GRADES[st.grade] || st.grade)}</i>` : ''}</span>`;
const stocksOf = id => STOCKS.filter(st => st.node === id || (st.also || []).includes(id));

// ── 자료로 화면을 짓는다 ──
function build(d) {
  D = d;
  document.title = `${d.title} · Insight`;
  $('h1').textContent = d.title; $('sub').textContent = d.sub || '';
  $('flow-tab').textContent = d.flowLabel || '흐름도';
  $('geo-note').textContent = d.geoNote || '점은 본사 · 주요 거점이 있는 도시에 박았다(도시 수준) · 선은 흐름도의 연결을 칸의 대표 자리끼리 그은 것 · 지도 © OpenStreetMap · Protomaps';
  LINKS = d.links || []; EXTRA = d.extra || []; INFO = d.info || {};
  STOCKS = d.stocks || []; GRADES = d.grades || {}; SITES = d.sites || []; TYPES = d.lineTypes || {};
  Object.keys(GRADES).forEach((k, i) => { GRADE_NO[k] = i + 1; });
  // 선 종류별 CSS — 색은 토큰으로
  const css = [];
  Object.entries(TYPES).forEach(([t, v]) => {
    const tok = TOKEN[v.color] || TOKEN.accent;
    LINE_COLOR[t] = rgbOf(tok);

const keyOf = st => st.code || st.ticker || '';

const n0 = v => v == null ? '—' : Number(v).toLocaleString('ko-KR', { maximumFractionDigits: 2 });
const ymd = s => s && s.length === 8 ? `${s.slice(0, 4)}-${s.slice(4, 6)}-${s.slice(6)}` : (s || '');
const neg = v => (v != null && v < 0) ? ' class="neg"' : '';
function finRow(label, row, cols, fmt = won) {
  if (!row) return '';
  return `<tr><td>${esc(label)}</td>${cols.map(c => `<td${neg(row[c.key])}>${fmt(row[c.key])}</td>`).join('')}</tr>`;
}
function renderCard(st, c) {
  const title = `<h2>${esc(st.name)} <small>${esc(keyOf(st))}${st.grade ? ' · ' + esc(GRADES[st.grade] || st.grade) : ''}</small></h2>`;
  if (!c) {
    return title + `<p class="meta">${st.code || st.ticker ? '카드 자료가 아직 없습니다 — tools/fetch-company-cards.py 를 돌리면 생깁니다' : '비상장 — 공시 · 증권사 자료가 없습니다'}</p>`;
  }
  let h = title;
  const d = c.dart, n = c.naver, e = c.edgar, err = c.errors || {};
  h += `<p class="meta">${d && d.corpName ? esc(d.corpName) + ' · ' : ''}${d && d.homepage ? `<a href="https://${esc(d.homepage.replace(/^https?:\/\//, ''))}" target="_blank" rel="noopener">${esc(d.homepage)}</a> · ` : ''}${e && e.sic ? esc(e.sic) + ' · ' : ''}지도 칸: ${esc((c.maps || []).map(m => m.node).join(' · '))}</p>`;
  // 사업 — 회사가 직접 쓴 글
  if (d) {
    const b = d.business;
    h += `<h3>사업 <span class="src">출처 금감원 DART${b ? ` · ${esc(b.report)} · <a href="${esc(b.from)}" target="_blank" rel="noopener">원문 ›</a>` : ''}</span></h3>`;
    h += b ? `<p>${esc(b.text)}</p>` : `<p class="none">「사업의 개요」 를 못 받았습니다${err.dart ? ' — ' + esc(err.dart) : ''}</p>`;
  } else if (e) {
    h += `<h3>사업 <span class="src">출처 미국 증권위 EDGAR${e.report ? ` · ${esc(e.report.form)} ${esc(e.report.date)} · <a href="${esc(e.report.from)}" target="_blank" rel="noopener">원문(영어) ›</a>` : ''}</span></h3>`;
    h += `<p>${esc(e.entityName || '')}${e.sic ? ' — ' + esc(e.sic) : ''}. 사업 설명 본문은 연차보고서(10-K · 20-F)에 영어로 있습니다 — 위 원문 링크.</p>`;
  } else {
    h += `<h3>사업</h3><p class="none">출처에서 못 받았습니다${err.dart ? ' — ' + esc(err.dart) : ''}</p>`;
  }
  // 실적 · 추정 (국내 — 네이버/FnGuide)
  if (n && n.columns && n.columns.length) {
    const cols = n.columns;
    h += `<h3>실적 · 증권사 추정 <span class="src">출처 네이버 증권(FnGuide) · 단위 억원</span></h3>`;
    h += `<table><tr><th></th>${cols.map(c => `<th${c.estimate ? ' class="est"' : ''}>${esc(c.label)}${c.estimate ? '(E)' : ''}</th>`).join('')}</tr>`;
    h += finRow('매출액', n.rows['매출액'], cols) + finRow('영업이익', n.rows['영업이익'], cols) + finRow('당기순이익', n.rows['당기순이익'], cols);
    h += finRow('영업이익률 %', n.rows['영업이익률'], cols, n0) + finRow('ROE %', n.rows['ROE'], cols, n0);
    h += finRow('EPS 원', n.rows['EPS'], cols, n0) + finRow('PER 배', n.rows['PER'], cols, n0) + finRow('PBR 배', n.rows['PBR'], cols, n0);
    h += `</table><p class="meta">(E) 열은 증권사 추정 평균 — 아직 안 난 실적입니다. 억원 · 1조 이상은 조로 적음</p>`;
  } else if (e && e.financials) {
    const f = e.financials, rev = f.revenue, op = f.operatingIncome, ni = f.netIncome;
    const years = rev ? Object.keys(rev.values) : (op ? Object.keys(op.values) : []);
    const unit = (rev || op || ni || {}).unit || 'USD';
    const big = v => v == null ? '—' : (v / 1e8).toLocaleString('ko-KR', { maximumFractionDigits: 1 });
    h += `<h3>실적 <span class="src">출처 미국 증권위 EDGAR · 회계연도(끝나는 달) · 단위 억 ${esc(unit)}</span></h3>`;
    h += `<table><tr><th></th>${years.map(y => `<th>~${esc(y.slice(0, 7))}</th>`).join('')}</tr>`;
    [['매출', rev], ['영업이익', op], ['순이익', ni]].forEach(([lb, row]) => {
      if (row) h += `<tr><td>${lb}</td>${years.map(y => `<td${neg(row.values[y])}>${big(row.values[y])}</td>`).join('')}</tr>`;
    });
    h += `</table>`;
  }
  // 현재가치 · 미래가치
  if (n) {
    const t = n.totals || {}, cs = n.consensus || {};
    h += `<h3>현재가치 <span class="src">출처 네이버 증권</span></h3><div class="kv">`;
    [['PER', t['PER']], ['PBR', t['PBR']], ['배당수익률', t['배당수익률']]].forEach(([k, v]) => { h += `<div><b>${esc(v || '—')}</b><span>${k}</span></div>`; });
    h += `</div>`;
    h += `<h3>미래가치 — 증권사 컨센서스 <span class="src">출처 네이버 증권(FnGuide) · ${esc(cs.asOf || '')} 집계</span></h3><div class="kv">`;
    h += `<div><b>${cs.targetPriceMean != null ? n0(cs.targetPriceMean) + '원' : '—'}</b><span>목표주가 평균</span></div>`;
    h += `<div><b>${cs.recommMean != null ? n0(cs.recommMean) + ' / 5' : '—'}</b><span>투자의견 평균(5 매수)</span></div>`;
    const est = n.columns.find(c => c.estimate), opE = est && n.rows['영업이익'] ? n.rows['영업이익'][est.key] : null;
    h += `<div><b>${won(opE)}</b><span>${est ? esc(est.label) + ' 영업이익 추정(억원)' : '추정 없음'}</span></div></div>`;
    h += `<h3>증권사 리포트 <span class="src">출처 네이버 증권 · 최근 ${(n.reports || []).length}건</span></h3>`;
    h += (n.reports || []).length ? `<ul class="rep">${n.reports.map(r => `<li><span class="b">${esc(r.broker)}</span><a href="${esc(r.from)}" target="_blank" rel="noopener">${esc(r.title)}</a><span class="d">${esc(ymd(r.date))}</span></li>`).join('')}</ul>` : `<p class="none">최근 리포트 없음</p>`;
  } else if (e) {
    h += `<h3>미래가치 — 증권사 컨센서스</h3><p class="none">EDGAR(공시)에는 증권사 전망이 없습니다 — 해외 컨센서스 출처는 아직 안 정했습니다</p>`;
  } else if (err.naver) {
    h += `<h3>실적 · 컨센서스</h3><p class="none">네이버 증권에서 못 받았습니다 — ${esc(err.naver)}</p>`;
  }
  h += `<div class="foot">받은 시각 ${esc(c.fetchedAt || CARDS_AT)} · 값은 출처 그대로이고 시황분석이 고치지 않았습니다 · 등급(대장 · 주도 · 소부장)만 시황분석 판단`;
  if (st.code) h += ` · <a href="../holdings/stock.html?code=${esc(st.code)}" target="_blank" rel="noopener">홀딩스 종목 창(차트 · 재무 카드) ›</a>`;
  h += `</div>`;
  return h;
}
function openCard(key) {
  const st = STOCKS.find(s => keyOf(s) === key); if (!st) return;
  $('co').innerHTML = `<button class="x" data-co-close>닫기 ✕</button>` + renderCard(st, CARDS ? CARDS[key] : null);
  $('co-wrap').classList.add('is-on'); $('co-wrap').setAttribute('aria-hidden', 'false'); $('co').scrollTop = 0;
}
function closeCard() { $('co-wrap').classList.remove('is-on'); $('co-wrap').setAttribute('aria-hidden', 'true'); }
document.addEventListener('click', e => {
  if (e.target.closest('[data-co-close]')) { closeCard(); return; }
  const s = e.target.closest('.stk[data-co]'); if (!s) return;
  e.stopPropagation(); e.preventDefault(); openCard(s.dataset.co);
}, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });


// ── 부품 분해도(3D) — 칸 패널의 단추 → 덮는 창 안 iframe ──
function openParts(page) { const f = $('parts-frame'); if (f.getAttribute('src') !== page) f.setAttribute('src', page); $('parts-wrap').classList.add('is-on'); $('parts-wrap').setAttribute('aria-hidden', 'false'); }
function closeParts() { $('parts-wrap').classList.remove('is-on'); $('parts-wrap').setAttribute('aria-hidden', 'true'); }
document.addEventListener('click', e => {
  if (e.target.closest('[data-parts-close]')) { closeParts(); return; }
  const b = e.target.closest('.parts-btn[data-parts]'); if (b) { e.stopPropagation(); openParts(b.dataset.parts.replace(/[^A-Za-z0-9._-]/g, '')); }
}, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeParts(); });

// ── 시작: ?map=<이름> 의 자료를 읽는다 (기본 ai) · ?view=flow 면 흐름도부터 ──
(async () => {
  const q = new URLSearchParams(location.search), id = (q.get('map') || 'ai').replace(/[^a-z0-9_-]/gi, '');
  try {
    const r = await fetch(`data/maps/${id}.json`, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    build(await r.json());
    await loadCards();
    if (q.get('parts')) openParts(q.get('parts').replace(/[^A-Za-z0-9._-]/g, ''));   // ?parts=hbm3d.html — 검수용
    if (q.get('co')) openCard(q.get('co').replace(/[^A-Za-z0-9]/g, ''));   // ?co=000660 — 카드를 바로 연다(링크 · 검수용)
  } catch (e) {
    console.error('[지도] 자료를 못 읽었습니다', id, e);
    panel.innerHTML = `<div class="err">지도 자료(data/maps/${esc(id)}.json)를 못 읽었습니다.</div>`;
    return;
  }
  showView(q.get('view') === 'flow' ? 'flow' : 'geo');
})();
</script>
