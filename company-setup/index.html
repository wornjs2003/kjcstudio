<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Insight · KJC Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/theme.css" />
<link rel="stylesheet" href="../assets/css/common.css" />
<link rel="stylesheet" href="../assets/css/nav.css" />
<!-- 구성은 홀딩스 첫 화면을 그대로 따른다 (2026-10-01 지시 — 「홀딩스 화면이랑 거의 비슷하게」).
     베끼지 않고 홀딩스 CSS 를 그대로 불러 쓴다 — 크기·간격·높이 고정이 한 곳에서 정해지고,
     홀딩스를 고치면 여기도 따라간다 (루트 CLAUDE.md 「같은 값은 한 곳에만 둔다」).
     ⚠️ 그래서 holdings/css/frame.css · home.css 를 고칠 때 이 화면도 함께 바뀐다 -->
<link rel="stylesheet" href="../holdings/css/frame.css" />
<link rel="stylesheet" href="../holdings/css/home.css" />
<!-- 모달은 홀딩스 것을 그대로 쓴다 — 닫는 길 넷 · 크기가 한 곳에서 정해진다 (2026-10-02) -->
<link rel="stylesheet" href="../holdings/css/modal.css" />
<link rel="stylesheet" href="css/insight.css" />
</head>
<body data-nav="company-setup" data-site-root="../">
<div id="site-nav"></div>

<!-- 2026-10-01 — 칸과 제목만 둔다. 내용은 재권님과 화면을 보며 하나씩 채운다 -->
<div class="kh-app kh-app-wide">
  <main class="kh-main">
    <!-- 갈래 탭 — 홀딩스 「홈 · 국내 · 미국 …」 자리. 아직 어디로도 가지 않는다 -->
    <nav class="kh-cat" aria-label="갈래">
      <a class="is-on" href="#">홈</a>
      <a href="#">시황 · 전망</a>
      <a href="#">영상 분석</a>
      <a href="#">뉴스 분석</a>
      <a href="#">종목 분석</a>
      <a href="#">산업 분석</a>
      <a href="#">투자 전략</a>
      <a href="#">경제 지표</a>
      <span class="kh-cat-my">증권사 리포트</span>
    </nav>

    <!-- 홀딩스 지수 띠 자리 -->
    <div class="kh-ixbar"><div class="in-strip">오늘의 시황 한 줄</div></div>
    <!-- 홀딩스 장 상태 줄 자리 -->
    <div class="kh-mkt">오늘의 핵심</div>

    <!-- 홀딩스 「고른 종목 차트 + 오른쪽 패널」 자리 -->
    <section class="kh-idx" aria-label="실시간 속보">
      <div class="kh-card kh-idx-main">
        <div class="kh-idx-head"><b class="kh-idx-name">실시간 속보</b><span class="in-asof" data-asof></span></div>
        <!-- 홀딩스 차트 자리 — 높이(550px)를 홀딩스 home.css 의 .kh-idx-chart 가 정한다 -->
        <div class="kh-idx-chart in-scroll"><ul class="in-news" data-feed="flash"></ul></div>
      </div>
      <aside class="kh-card kh-idxp" aria-label="분석 요약">
        <div class="kh-idxp-s"><div class="kh-idxp-h">해외 뉴스</div><ul class="in-news in-sm" data-feed="world" data-n="5"></ul></div>
        <div class="kh-idxp-s"><div class="kh-idxp-h">핵심 숫자</div></div>
        <div class="kh-idxp-s kh-idxp-dc"><div class="kh-idxp-h">관련 뉴스</div></div>
      </aside>
    </section>

    <!-- 홀딩스 「지금 뜨는 산업 + 데일리분석」 줄 자리 -->
    <section class="kh-rank" aria-label="분석 갈래">
      <div class="kh-card kh-sc-card">
        <!-- 2026-10-02 지시 — 공시 대신 종목 분석. 글은 data/stock-analysis.json 한 곳에 쌓는다.
             공시는 fetch-naver-news.py 가 그대로 받는다 — 화면에서만 뺐다 -->
        <!-- 2026-10-03 지시 — 칸 이름 「돈의 흐름」. 머리를 누르면 AI 생태계의 세계 지도(지구본)가 모달로 뜬다.
             href 는 그대로 두어 새 탭 · 직접 주소도 된다(모달 룰) -->
        <div class="kh-tabs"><a class="kh-tab is-active" href="ecosystem.html?view=geo" data-modal="page">돈의 흐름</a></div>
        <ul class="in-news in-sm in-scroll" data-analysis></ul>
      </div>
      <div class="kh-card kh-dlm-card">
        <div class="kh-tabs"><button class="kh-tab is-active">영상 분석</button></div>
        <ul class="in-news in-scroll" data-videos></ul>
      </div>
    </section>
  </main>

  <!-- 홀딩스 오른쪽 칸 자리 — 실시간 순위 칸 하나만 둔다 (2026-10-01 아래 칸 지움) -->
  <aside class="kh-side" aria-label="많이 본 뉴스">
    <div class="kh-side-wrap">
      <div class="kh-card kh-rank-card">
        <div class="kh-tabs"><button class="kh-tab is-active">많이 본 뉴스</button></div>
        <ul class="in-news in-rank in-scroll" data-feed="rank"></ul>
      </div>
    </div>
  </aside>
</div>

<script src="../assets/js/main.js"></script>
<script src="js/insight.js"></script>
<script type="module" src="js/insight-modal.js"></script>
</body>
</html>
