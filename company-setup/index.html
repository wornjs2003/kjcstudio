<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Insight · KJC Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/theme.css" />
<link rel="stylesheet" href="../assets/css/common.css" />
<link rel="stylesheet" href="../assets/css/nav.css" />
<!-- 구성은 홀딩스 첫 화면을 그대로 따른다 (2026-10-01 지시 — 「홀딩스 화면이랑 거의 비슷하게」).
     베끼지 않고 홀딩스 CSS 를 그대로 불러 쓴다 — 크기·간격·높이 고정이 한 곳에서 정해지고,
     홀딩스를 고치면 여기도 따라간다 (루트 CLAUDE.md 「같은 값은 한 곳에만 둔다」).
     ⚠️ 그래서 holdings/css/frame.css · home.css 를 고칠 때 이 화면도 함께 바뀐다 -->
<link rel="stylesheet" href="../holdings/css/frame.css" />
<link rel="stylesheet" href="../holdings/css/home.css" />
<!-- 모달은 홀딩스 것을 그대로 쓴다 — 닫는 길 넷 · 크기가 한 곳에서 정해진다 (2026-10-02) -->
<link rel="stylesheet" href="../holdings/css/modal.css" />
<link rel="stylesheet" href="css/insight.css" />
</head>
<body data-nav="company-setup" data-site-root="../">
<div id="site-nav"></div>

<!-- 2026-10-01 — 칸과 제목만 둔다. 내용은 재권님과 화면을 보며 하나씩 채운다 -->
<div class="kh-app kh-app-wide">
  <main class="kh-main">
    <!-- 갈래 탭 — 홀딩스 「홈 · 국내 · 미국 …」 자리. 아직 어디로도 가지 않는다 -->
    <nav class="kh-cat" aria-label="갈래">
      <a class="is-on" href="#">홈</a>
      <a href="analysis.html">종목 분석</a>
      <a href="#">시황 · 전망</a>
      <a href="#">영상 분석</a>
      <a href="#">뉴스 분석</a>
      <a href="#">산업 분석</a>
      <a href="#">투자 전략</a>
      <a href="#">경제 지표</a>
      <span class="kh-cat-my">증권사 리포트</span>
    </nav>

    <!-- 홀딩스 지수 띠 자리 -->
    <div class="kh-ixbar"><div class="in-strip">오늘의 시황 한 줄</div></div>
    <!-- 홀딩스 장 상태 줄 자리 -->
    <div class="kh-mkt">오늘의 핵심</div>

    <!-- 홀딩스 「고른 종목 차트 + 오른쪽 패널」 자리 -->
    <!-- 2026-10-06 지시 — 칸 재배치. 큰 칸은 돈의 흐름(전에는 실시간 속보), 옆 칸 첫 절은 영상 분석(전에는 해외 뉴스).
         속보 · 해외 뉴스 · 많이 본 뉴스는 오른쪽 「뉴스」 칸으로. 칸의 자리 · 크기는 그대로(시안 실측 다섯 칸 전후 같음) -->
    <section class="kh-idx" aria-label="돈의 흐름">
      <div class="kh-card kh-idx-main">
        <!-- 2026-10-03 지시 — 칸 이름 「돈의 흐름」. 머리를 누르면 AI 생태계의 세계 지도(지구본)가 모달로 뜬다.
             href 는 그대로 두어 새 탭 · 직접 주소도 된다(모달 룰). 글은 data/stock-analysis.json 한 곳에 쌓는다 -->
        <!-- 제목 옆 토글 — 칸 안 지도를 지구본 ↔ 흐름도로 (2026-10-06 재권님 「옆으로 지구본/흐름도 왔다갔다」) -->
        <div class="kh-idx-head"><b class="kh-idx-name"><a href="flowmap.html?map=ai&view=geo" data-modal="page">돈의 흐름</a></b>
          <span class="in-map-views" data-map-views><button class="kh-chip is-active" data-view="geo">지구본</button><button class="kh-chip" data-view="flow">흐름도</button></span>
          <span class="in-asof" data-asof-map></span></div>
        <!-- 홀딩스 차트 자리 — 높이(550px)를 홀딩스 home.css 의 .kh-idx-chart 가 정한다 -->
        <!-- 2026-10-06 지시 — 지도를 칸에 바로(AI 생태계 지구본 · 손대기 전까지 멈춤). 칩으로 지도를 바꾸고 제목을 누르면 모달로 크게.
             칩은 insight.js 가 data/stock-analysis.json 의 지도 글에서 만든다 — 목록을 여기 또 적지 않는다 -->
        <div class="kh-idx-chart in-map">
          <div class="kh-chips in-map-chips" data-map-chips></div>
          <iframe class="in-map-frame" data-map-frame src="flowmap.html?map=ai&view=geo&embed=1" title="돈의 흐름 지도"></iframe>
        </div>
      </div>
      <aside class="kh-card kh-idxp" aria-label="영상 분석">
        <div class="kh-idxp-s"><div class="kh-idxp-h">영상 분석<span class="in-asof">유튜브 · 시황분석 고름</span></div><ul class="in-news in-sm" data-videos></ul></div>
        <div class="kh-idxp-s"><div class="kh-idxp-h">핵심 숫자</div></div>
        <div class="kh-idxp-s kh-idxp-dc"><div class="kh-idxp-h">관련 뉴스</div></div>
      </aside>
    </section>

    <!-- 홀딩스 「지금 뜨는 산업 + 데일리분석」 줄 자리 -->
    <!-- 미정: 2026-10-06 재권님 「빈곳은 칸만 놔두고 우선 비워놔」 — 돈의 흐름 · 영상 분석이 위로 올라가 비었다.
         무엇을 넣을지는 재권님이 정하신다. 높이는 insight.css 의 .kh-rank > .kh-card(--kh-row-h)가 그대로 잡는다 -->
    <section class="kh-rank" aria-label="비워 둔 칸">
      <div class="kh-card kh-sc-card"></div>
      <div class="kh-card kh-dlm-card"></div>
    </section>
  </main>

  <!-- 홀딩스 오른쪽 칸 자리 — 「뉴스」 하나. 2026-10-06 지시 — 많이 본 뉴스 → 실시간 속보 → 해외 뉴스 순서(16:1x) -->
  <aside class="kh-side" aria-label="뉴스">
    <div class="kh-side-wrap">
      <div class="kh-card kh-rank-card">
        <!-- 2026-10-06 17:5x 지시 — 세로로 쌓으니 아래 둘이 안 보여 탭 셋으로(홀딩스 순위 칸의 코스피|코스닥 탭과 같은 모양). 누르면 목록만 바뀌고 칸은 그대로 -->
        <div class="kh-tabs" data-news-tabs><button class="kh-tab is-active" data-tab="rank">많이 본</button><button class="kh-tab" data-tab="flash">최신</button><button class="kh-tab" data-tab="world">해외</button><span class="in-asof" data-asof="네이버 뉴스"></span></div>
        <div class="in-scroll">
          <ul class="in-news in-rank" data-feed="rank" data-pane="rank"></ul>
          <ul class="in-news in-sm" data-feed="flash" data-pane="flash" hidden></ul>
          <ul class="in-news in-sm" data-feed="world" data-pane="world" hidden></ul>
        </div>
      </div>
    </div>
  </aside>
</div>

<!-- 미리 받기 (2026-10-06 로딩 개선) — 돈의 흐름 칸의 지구본 · HBM 3D 모달이 쓸 라이브러리를 첫 화면이 뜰 때 받아 둔다. 같은 출처라 틀 · 모달이 캐시에서 쓴다 -->
<link rel="modulepreload" href="vendor/three/three.module.min.js">
<link rel="modulepreload" href="vendor/three/addons/controls/OrbitControls.js">
<link rel="modulepreload" href="vendor/three/addons/renderers/CSS2DRenderer.js">
<link rel="modulepreload" href="vendor/three/addons/geometries/RoundedBoxGeometry.js">
<link rel="modulepreload" href="vendor/three/addons/environments/RoomEnvironment.js">
<script src="../assets/js/main.js"></script>
<script src="js/insight.js"></script>
<script type="module" src="js/insight-modal.js"></script>
</body>
</html>
