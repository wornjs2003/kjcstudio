# thekjc.co.kr — 10분 안에 5번 틀리면 1시간 막는다 · 사무실 IP 제외 (2026-11-04 재권님 「응 그렇게 해」)
[caddy-thekjc]
enabled  = true
filter   = caddy-thekjc
logpath  = /var/log/caddy/thekjc-access.log
backend  = polling
maxretry = 5
findtime = 10m
bantime  = 1h
port     = http,https
banaction = nftables-multiport
ignoreip = 127.0.0.1/8 ::1 <사무실 공인 IP — 가비아 보안 그룹 22번 줄의 값 · 공개 저장소라 여기 안 적는다>
