<body data-nav="ai-work" data-site-root="../">

<main class="aw-wrap">

  <header class="aw-head">
    <div>
      <h1>AI Work<span class="dot">.</span></h1>
      <p class="aw-sub">
        AI 를 써서 <b>컨셉을 만들거나 모델링을 만드는 순서</b>를 여기서 짭니다.<br>
        작업을 컨셉 칸에 얹고 <b>모델링 · 애니메이션 · 배경</b>으로 옮겨 갑니다.
        <b>프로젝트 보드와 같은 방식입니다</b> — 칸 이름만 다릅니다.
      </p>
    </div>
    <span class="aw-saved" id="aw-saved">불러오는 중</span>

  <!-- 칸 — 프로젝트 보드의 「할 일 · 진행중 · 완료」 자리.

       작업 하나가 칸을 옮겨 가며 만들어진다. -->
